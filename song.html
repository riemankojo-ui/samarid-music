<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song - Samarid Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { --bg: #f2f2f2; --card: #ffffff; --border: #e0e0e0; --text: #1a1a1a; --text2: #666666; --accent: #ff0033; --header-bg: #111111; --dark: #0a0a0a; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding-bottom: 40px; }

  .header { position: sticky; top: 0; background: var(--header-bg); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
  .back-btn { background: #222; color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .back-btn:active { background: var(--accent); }
  .logo { font-size: 18px; font-weight: 900; color: #fff; text-decoration: none; flex: 1; text-align: center; }
  .logo span { color: var(--accent); }

  .label-banner { background: linear-gradient(135deg, #ff0033 0%, #b3002d 100%); color: #fff; padding: 12px 20px; display: flex; align-items: center; justify-content: center; gap: 12px; font-weight: 900; letter-spacing: 2px; font-size: 13px; box-shadow: 0 4px 15px rgba(255, 0, 51, 0.3); }
  .label-banner .label-text { text-transform: uppercase; }

  .container { max-width: 700px; margin: 0 auto; padding: 20px 16px; }

  .big-title { font-size: 18px; font-weight: 900; line-height: 1.3; text-align: center; margin-bottom: 20px; padding: 15px 10px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; color: var(--text); }
  .big-title .accent { color: var(--accent); }

  .detail-cover-box { width: 100%; max-width: 300px; margin: 0 auto 25px; aspect-ratio: 1 / 1; border-radius: 12px; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.12); background: #000; }
  .detail-cover-box img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .detail-title { font-size: 22px; font-weight: 900; line-height: 1.25; margin-bottom: 6px; text-align: center; }
  .detail-meta { font-size: 13px; color: #999; margin-bottom: 8px; text-align: center; }
  .detail-meta .artist { color: var(--accent); font-weight: 700; }

  .play-count-wrapper { text-align: center; margin-bottom: 20px; }
  .play-count-badge { display: inline-flex; align-items: center; gap: 6px; background: linear-gradient(135deg, #ff0033 0%, #b3002d 100%); color: #fff; padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; box-shadow: 0 4px 15px rgba(255, 0, 51, 0.3); }

  .detail-label { text-align: center; font-size: 11px; color: #999; margin-bottom: 25px; letter-spacing: 1px; font-weight: 600; text-transform: uppercase; }
  .detail-label i { color: var(--accent); margin-right: 4px; }

  .detail-section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .detail-section h4 { font-size: 12px; color: var(--text2); letter-spacing: 2px; text-transform: uppercase; font-weight: 700; margin-bottom: 12px; }
  .detail-section p { font-size: 15px; line-height: 1.7; }

  .download-buttons { display: flex; flex-direction: column; gap: 12px; }
  .btn-download, .btn-play { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px; border-radius: 10px; font-size: 15px; font-weight: 700; text-decoration: none; color: #fff; background: #e74c3c; cursor: pointer; border: none; font-family: inherit; }
  .btn-download:active, .btn-play:active { background: #c0392b; }

  /* === SHARE SECTION === */
  .share-section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .share-section h4 { font-size: 12px; color: var(--text2); letter-spacing: 2px; text-transform: uppercase; font-weight: 700; margin-bottom: 15px; text-align: center; }
  .share-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .share-btn { display: flex; align-items: center; justify-content: center; gap: 8px; padding: 14px; border-radius: 10px; font-size: 13px; font-weight: 700; cursor: pointer; border: none; font-family: inherit; text-decoration: none; transition: all 0.2s; }
  .share-btn:active { transform: scale(0.96); }
  .share-btn i { font-size: 16px; }
  .share-whatsapp { background: #25D366; color: #fff; }
  .share-facebook { background: #1877F2; color: #fff; }
  .share-twitter { background: #000; color: #fff; }
  .share-copy { background: var(--accent); color: #fff; }

  .presented-by { text-align: center; padding: 15px; margin-bottom: 15px; background: var(--card); border: 1px dashed var(--border); border-radius: 10px; font-size: 12px; color: #666; font-weight: 600; }
  .presented-by strong { color: var(--accent); }

  .dark-section { background: var(--dark); color: #fff; border-radius: 16px; padding: 30px 20px; margin-top: 30px; border: 1px solid #222; }
  .dark-section-title { font-size: 14px; font-weight: 900; letter-spacing: 2px; text-transform: uppercase; color: var(--accent); text-align: center; margin-bottom: 6px; }
  .dark-section-subtitle { font-size: 12px; color: #888; text-align: center; margin-bottom: 20px; }

  .contact-box { text-align: center; padding: 20px 15px; background: #111; border: 1px solid #222; border-radius: 12px; margin-bottom: 25px; }
  .contact-label { font-size: 10px; color: #666; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; margin-bottom: 8px; }
  .contact-email { font-size: 16px; font-weight: 700; color: #fff; text-decoration: line-through; text-decoration-color: var(--accent); text-decoration-thickness: 2px; letter-spacing: 0.5px; word-break: break-all; }
  .contact-hint { font-size: 11px; color: #666; margin-top: 10px; font-style: italic; }

  .artists-label { font-size: 10px; color: #666; letter-spacing: 2px; text-transform: uppercase; font-weight: 700; margin-bottom: 12px; padding-left: 4px; }
  .artists-list { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .artist-link { display: block; padding: 14px 12px; background: #111; border: 1px solid #222; border-radius: 10px; text-decoration: none; color: var(--accent); font-size: 14px; font-weight: 700; text-align: center; transition: 0.15s; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist-link:active { background: #1a1a1a; transform: scale(0.97); }

  .dark-footer-note { text-align: center; font-size: 11px; color: #444; margin-top: 25px; letter-spacing: 1px; }

  .footer { padding: 30px; text-align: center; font-size: 11px; color: var(--text2); border-top: 1px solid var(--border); margin-top: 40px; background: var(--card); }
  .footer .brand { color: var(--accent); font-weight: 700; }
  .loading { text-align: center; padding: 60px 20px; color: var(--text2); }
</style>
</head>
<body>

  <header class="header">
    <button class="back-btn" onclick="history.back()"><i class="fas fa-arrow-left"></i> Back</button>
    <a href="index.html" class="logo">SAMARID <span>MUSIC</span></a>
    <div style="width: 70px;"></div>
  </header>

  <div class="label-banner">
    <i class="fas fa-compact-disc"></i>
    <span class="label-text">Samarid Music Release</span>
    <i class="fas fa-compact-disc"></i>
  </div>

  <div class="container" id="songDetail">
    <div class="loading">Loading song...</div>
  </div>

  <footer class="footer"><span class="brand">SAMARID MUSIC</span> © 2026</footer>

  <script>
    const SUPABASE_URL = "https://kamnfnukaizdglntcdvi.supabase.co";
    const SUPABASE_KEY = "sb_publishable__YPveWCU1NMYYsegLLYskg_38s0VRip";
    const CONTACT_EMAIL = "wunatehk@gmail.com";

    let currentSongData = null;

    async function loadSong() {
      const urlParams = new URLSearchParams(window.location.search);
      const songId = urlParams.get('id');
      const container = document.getElementById('songDetail');

      if (!songId) { container.innerHTML = '<div class="loading">Song not found.</div>'; return; }

      try {
        const res = await fetch(SUPABASE_URL + '/rest/v1/songs?id=eq.' + songId, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
        });
        const data = await res.json();
        const s = data[0];

        if (s) {
          currentSongData = s;
          const artist = s.artist_name || 'Samarid';
          const downloadTitle = artist + ' - ' + s.title;
          document.title = downloadTitle + ' - Samarid Music';

          let artistsList = [];
          try {
            const artistsRes = await fetch(SUPABASE_URL + '/rest/v1/songs?select=artist_name', {
              headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
            });
            const artistsData = await artistsRes.json();
            const uniqueNames = [...new Set(artistsData.map(a => (a.artist_name || 'Samarid').trim()))];
            artistsList = uniqueNames
              .filter(n => n.toLowerCase() !== artist.toLowerCase())
              .sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase()));
          } catch (e) { console.error("Could not load artists", e); }

          const artistsHTML = artistsList.map(name => `
            <a href="artist-template.html?name=${encodeURIComponent(name)}" class="artist-link">${name}</a>
          `).join('') || '<p style="text-align:center; color:#444; font-size:12px; grid-column:1/-1;">More artists coming soon.</p>';

          // Build share text
          const shareText = encodeURIComponent('🎵 Listen to "' + s.title + '" by ' + artist + ' on Samarid Music!');
          const shareUrl = encodeURIComponent(window.location.href);

          container.innerHTML = `
            <div class="big-title">Download MP3 <span class="accent">${downloadTitle}</span></div>

            <div class="detail-cover-box"><img src="${s.cover}" alt="${s.title}"></div>

            <h1 class="detail-title">${s.title}</h1>
            <p class="detail-meta"><span class="artist">${artist}</span> • ${s.date} • ${s.category}</p>

            <div class="play-count-wrapper">
              <span class="play-count-badge" id="playCountBadge">🔥 ${s.plays || 0} plays</span>
            </div>

            <p class="detail-label"><i class="fas fa-compact-disc"></i> A Samarid Music Release</p>

            <div class="detail-section">
              <h4>📖 About this Song</h4>
              <p>${s.description}</p>
            </div>

            <div class="presented-by">
              🎵 <strong>SAMARID MUSIC</strong> presents this track • © 2026 Samarid Music
            </div>

            <div class="detail-section">
              <h4>⬇️ Get the Song</h4>
              <div class="download-buttons">
                <a href="${s.downloadurl}" download="${artist} - ${s.title} [Samarid Music].mp3" id="detailDownload" class="btn-download" target="_blank">
                  <i class="fas fa-download"></i> Download MP3
                </a>
                <button onclick="playSong()" class="btn-play">
                  <i class="fas fa-play"></i> Play Now
                </button>
              </div>
            </div>

            <!-- === SHARE SECTION === -->
            <div class="share-section">
              <h4>📤 Share this Song</h4>
              <div class="share-grid">
                <a href="https://wa.me/?text=${shareText}%20${shareUrl}" target="_blank" class="share-btn share-whatsapp">
                  <i class="fab fa-whatsapp"></i> WhatsApp
                </a>
                <a href="https://www.facebook.com/sharer/sharer.php?u=${shareUrl}" target="_blank" class="share-btn share-facebook">
                  <i class="fab fa-facebook"></i> Facebook
                </a>
                <a href="https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}" target="_blank" class="share-btn share-twitter">
                  <i class="fab fa-x-twitter"></i> X (Twitter)
                </a>
                <button onclick="copyLink()" class="share-btn share-copy">
                  <i class="fas fa-link"></i> Copy Link
                </button>
              </div>
            </div>

            <div class="dark-section">
              <h3 class="dark-section-title">Samarid Music</h3>
              <p class="dark-section-subtitle">Record Label • Ghana</p>

              <div class="contact-box">
                <p class="contact-label">📧 Contact / Bookings</p>
                <p class="contact-email">${CONTACT_EMAIL}</p>
                <p class="contact-hint">(Tap and hold to copy the email)</p>
              </div>

              <p class="artists-label">🎤 More Artists on Samarid Music</p>
              <div class="artists-list">
                ${artistsHTML}
              </div>

              <p class="dark-footer-note">© 2026 SAMARID MUSIC • ALL RIGHTS RESERVED</p>
            </div>
          `;
        } else { container.innerHTML = '<div class="loading">Song not found.</div>'; }
      } catch (e) { console.error("Error getting song: ", e); container.innerHTML = '<div class="loading">Error loading song.</div>'; }
    }

    // === PLAY SONG — Increments plays counter ===
    async function playSong() {
      if (!currentSongData) return;
      const songId = currentSongData.id;
      const currentPlays = currentSongData.plays || 0;
      const newPlays = currentPlays + 1;
      const badge = document.getElementById('playCountBadge');
      if (badge) badge.innerHTML = '🔥 ' + newPlays + ' plays';
      currentSongData.plays = newPlays;
      const playUrl = currentSongData.playurl || '#';
      if (playUrl && playUrl !== '#') window.open(playUrl, '_blank');
      try {
        await fetch(SUPABASE_URL + '/rest/v1/songs?id=eq.' + songId, {
          method: 'PATCH',
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ plays: newPlays })
        });
      } catch (e) { console.error('Could not save play count', e); }
    }

    // === COPY LINK ===
    async function copyLink() {
      const url = window.location.href;
      try {
        if (navigator.clipboard && window.isSecureContext) {
          await navigator.clipboard.writeText(url);
        } else {
          const ta = document.createElement('textarea');
          ta.value = url;
          ta.style.position = 'fixed';
          ta.style.opacity = '0';
          document.body.appendChild(ta);
          ta.select();
          document.execCommand('copy');
          document.body.removeChild(ta);
        }
        showToast('✅ Link copied!');
      } catch (e) {
        showToast('❌ Could not copy link');
      }
    }

    // === SIMPLE TOAST ===
    function showToast(msg) {
      const toast = document.createElement('div');
      toast.innerText = msg;
      toast.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:12px 24px;border-radius:30px;font-size:14px;font-weight:600;z-index:99999;box-shadow:0 10px 30px rgba(0,0,0,0.3);transition:opacity 0.3s;';
      document.body.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; }, 1800);
      setTimeout(() => { document.body.removeChild(toast); }, 2200);
    }

    loadSong();
  </script>
</body>
</html>
