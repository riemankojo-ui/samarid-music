<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song - Samarid Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { --bg: #f2f2f2; --card: #ffffff; --border: #e0e0e0; --text: #1a1a1a; --text2: #666666; --accent: #ff0033; --header-bg: #111111; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding-bottom: 40px; }
  .header { position: sticky; top: 0; background: var(--header-bg); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
  .back-btn { background: #222; color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }
  .logo { font-size: 18px; font-weight: 900; color: #fff; text-decoration: none; flex: 1; text-align: center; }
  .logo span { color: var(--accent); }
  .container { max-width: 700px; margin: 0 auto; padding: 20px 16px; }
  .detail-cover { width: 100%; aspect-ratio: 1/1; border-radius: 12px; overflow: hidden; background: #000; border: 1px solid var(--border); margin-bottom: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); }
  .detail-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .detail-title { font-size: 26px; font-weight: 900; line-height: 1.25; margin-bottom: 8px; }
  .detail-meta { font-size: 13px; color: #999; margin-bottom: 25px; }
  .detail-section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .detail-section h4 { font-size: 12px; color: var(--text2); letter-spacing: 2px; text-transform: uppercase; font-weight: 700; margin-bottom: 12px; }
  .detail-section p { font-size: 15px; line-height: 1.7; }
  .download-buttons { display: flex; flex-direction: column; gap: 12px; }
  .btn-download, .btn-play { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px; border-radius: 10px; font-size: 15px; font-weight: 700; text-decoration: none; color: #fff; background: #e74c3c; }
  .btn-download:active, .btn-play:active { background: #c0392b; }
  .footer { padding: 30px; text-align: center; font-size: 11px; color: var(--text2); border-top: 1px solid var(--border); margin-top: 40px; background: var(--card); }
  .footer .brand { color: var(--accent); font-weight: 700; }
  .loading { text-align: center; padding: 60px 20px; color: var(--text2); }
</style>
</head>
<body>

  <header class="header">
    <button class="back-btn" onclick="window.location.href='index.html'"><i class="fas fa-arrow-left"></i> Back</button>
    <a href="index.html" class="logo">SAMARID <span>MUSIC</span></a>
    <div style="width: 70px;"></div> <!-- Spacer for centering -->
  </header>

  <div class="container" id="songDetail">
    <div class="loading">Loading song...</div>
  </div>

  <footer class="footer"><span class="brand">SAMARID MUSIC</span> © 2026</footer>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyAmeKKhMA1YHs0VNkliwNUl4BvrQLS-RMY",
      authDomain: "samarid-music-e1a61.firebaseapp.com",
      projectId: "samarid-music-e1a61",
      storageBucket: "samarid-music-e1a61.firebasestorage.app",
      messagingSenderId: "435825568762",
      appId: "1:435825568762:web:2aa73d62cdb5197514d243",
      measurementId: "G-EHRCK42546"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    async function loadSong() {
      const urlParams = new URLSearchParams(window.location.search);
      const songId = urlParams.get('id');
      const container = document.getElementById('songDetail');

      if (!songId) {
        container.innerHTML = '<div class="loading">Song not found.</div>';
        return;
      }

      try {
        const docRef = doc(db, "songs", songId);
        const docSnap = await getDoc(docRef);

        if (docSnap.exists()) {
          const s = docSnap.data();
          container.innerHTML = `
            <div class="detail-cover"><img src="${s.cover}" alt="${s.title}"></div>
            <h1 class="detail-title">${s.title}</h1>
            <p class="detail-meta">${s.date} • ${s.category}</p>
            <div class="detail-section">
              <h4>📖 About this Song</h4>
              <p>${s.description}</p>
            </div>
            <div class="detail-section">
              <h4>⬇️ Get the Song</h4>
              <div class="download-buttons">
                <a href="${s.downloadUrl}" id="detailDownload" class="btn-download" target="_blank"><i class="fas fa-download"></i> Download MP3</a>
                <a href="${s.playUrl}" id="detailPlay" class="btn-play" target="_blank"><i class="fas fa-play"></i> Play Now</a>
              </div>
            </div>
          `;
        } else {
          container.innerHTML = '<div class="loading">Song not found.</div>';
        }
      } catch (e) {
        console.error("Error getting document: ", e);
        container.innerHTML = '<div class="loading">Error loading song.</div>';
      }
    }

    loadSong();
  </script>
</body>
</html>
