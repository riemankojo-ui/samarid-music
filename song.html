  <script>
    const SUPABASE_URL = "https://kamnfnukaizdglntcdvi.supabase.co";
    const SUPABASE_KEY = "sb_publishable__YPveWCU1NMYYsegLLYskg_38s0VRip";
    const CONTACT_EMAIL = "wunatehk@gmail.com";
    const PLAY_SECONDS_REQUIRED = 30;
    const PLAY_COOLDOWN_HOURS = 6;
    const VERIFY_BADGE = '<svg class="verify-badge" viewBox="0 0 22 22"><path fill="#1d9bf0" d="M20.396 11c-.018-.646-.215-1.275-.57-1.816-.354-.54-.852-.972-1.438-1.246.223-.607.27-1.264.14-1.897-.131-.634-.437-1.218-.882-1.687-.47-.445-1.053-.75-1.687-.882-.633-.13-1.29-.083-1.897.14-.273-.587-.704-1.086-1.245-1.44S11.647 1.62 11 1.604c-.646.017-1.273.213-1.813.568s-.969.854-1.24 1.44c-.608-.223-1.267-.272-1.902-.14-.635.13-1.22.436-1.687.882-.445.47-.749 1.055-.878 1.688-.13.633-.08 1.29.144 1.896-.587.274-1.087.705-1.443 1.245-.356.54-.555 1.17-.574 1.817.02.647.218 1.276.574 1.817.356.54.856.972 1.443 1.245-.224.606-.274 1.263-.144 1.896.13.634.433 1.218.877 1.688.47.443 1.054.747 1.687.878.633.132 1.29.084 1.897-.136.274.586.705 1.084 1.246 1.439.54.354 1.17.551 1.816.569.647-.016 1.276-.213 1.817-.567s.972-.854 1.245-1.44c.604.239 1.266.296 1.903.164.636-.132 1.22-.447 1.68-.907.46-.46.776-1.044.908-1.681s.075-1.299-.165-1.903c.586-.274 1.084-.705 1.439-1.246.354-.54.551-1.17.569-1.816zM9.662 14.85l-3.429-3.428 1.293-1.302 2.072 2.072 4.4-4.794 1.347 1.246z"/></svg>';

    function escapeHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    window.toggleMenu = function(e) {
      e.stopPropagation();
      const menu = document.getElementById('menuDropdown');
      const overlay = document.getElementById('menuOverlay');
      if (menu.classList.contains('open')) { menu.classList.remove('open'); overlay.classList.remove('open'); }
      else { menu.classList.add('open'); overlay.classList.add('open'); }
    }
    window.closeMenu = function() { document.getElementById('menuDropdown').classList.remove('open'); document.getElementById('menuOverlay').classList.remove('open'); }

    let visitorId = localStorage.getItem('samarid_visitor_id');
    if (!visitorId) {
      visitorId = 'v_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('samarid_visitor_id', visitorId);
    }

    let currentSongData = null;
    let isFollowingArtist = false;
    let currentArtistName = '';
    let isSongLiked = false;
    let secondsListened = 0;
    let playCountTimer = null;
    let hasCountedThisPlay = false;

    function hasRecentPlay(songId) {
      const key = 'lastplay_' + visitorId + '_' + songId;
      const lastPlay = localStorage.getItem(key);
      if (!lastPlay) return false;
      const hoursSince = (Date.now() - parseInt(lastPlay)) / (1000 * 60 * 60);
      return hoursSince < PLAY_COOLDOWN_HOURS;
    }
    function markPlayed(songId) {
      const key = 'lastplay_' + visitorId + '_' + songId;
      localStorage.setItem(key, Date.now().toString());
    }

    window.smartDownload = async function(btn) {
      if (!currentSongData) return;
      const url = currentSongData.downloadurl || currentSongData.audio_url || '';
      const artist = currentSongData.artist_name || 'Samarid';
      const title = currentSongData.title || 'Song';
      if (!url || url === '#') { showToast('No download link available'); return; }
      const cleanArtist = artist.replace(/[^\w\s\-\.]/g, '').trim();
      const cleanTitle = title.replace(/[^\w\s\-\.]/g, '').trim();
      const filename = cleanArtist + ' - ' + cleanTitle + ' [Samarid Music].mp3';
      const originalHTML = btn.innerHTML;
      btn.disabled = true;
      btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Preparing...';
      try {
        const response = await fetch(url, { mode: 'cors' });
        if (!response.ok) throw new Error('Fetch failed');
        const blob = await response.blob();
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(blobUrl), 3000);
        showToast('Download started!');
      } catch (e) {
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.target = '_blank';
        a.rel = 'noopener';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        showToast('Downloading...');
      } finally {
        btn.disabled = false;
        btn.innerHTML = originalHTML;
      }
    };

    function buildArtistLinks(artist, featuring, badge) {
      let html = '<a href="artist-template.html?name=' + encodeURIComponent(artist) + '" class="artist">' + escapeHtml(artist) + badge + '</a>';
      if (featuring && featuring.trim()) {
        const featList = featuring.split(',').map(x => x.trim()).filter(x => x);
        html += '<span>Feat</span>';
        html += featList.map(f => '<a href="artist-template.html?name=' + encodeURIComponent(f) + '" class="feat-link">' + escapeHtml(f) + '</a>').join(', ');
      }
      return html;
    }

    async function loadSong() {
      const urlParams = new URLSearchParams(window.location.search);
      let songId = urlParams.get('id');
      const container = document.getElementById('songDetail');
      const nowIso = new Date().toISOString();

      if (!songId) {
        try {
          const fallbackRes = await fetch(SUPABASE_URL + '/rest/v1/songs?select=id&or=(status.eq.live,status.is.null,release_at.lte.' + encodeURIComponent(nowIso) + ')&order=id.desc&limit=1', { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } });
          const fallbackData = await fallbackRes.json();
          if (Array.isArray(fallbackData) && fallbackData.length > 0) { songId = fallbackData[0].id; window.history.replaceState({}, '', '?id=' + songId); }
          else { container.innerHTML = '<div class="error-box"><div class="icon">🎵</div><h3>No Songs Yet</h3><p>No songs have been added.</p><a href="index.html">Go Home</a></div>'; return; }
        } catch (e) { container.innerHTML = '<div class="error-box"><div class="icon">⚠️</div><h3>Connection Error</h3><a href="index.html">Go Home</a></div>'; return; }
      }

      try {
        const res = await fetch(SUPABASE_URL + '/rest/v1/songs?id=eq.' + songId + '&or=(status.eq.live,status.is.null,release_at.lte.' + encodeURIComponent(nowIso) + ')', { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } });
        const data = await res.json();

        if (!data || data.length === 0) {
          container.innerHTML = '<div class="error-box"><div class="icon">🔍</div><h3>Song Not Found</h3><p>This song doesn\'t exist or hasn\'t been released yet.</p><a href="index.html">Browse Songs</a></div>';
          return;
        }

        const s = data[0];
        currentSongData = s;
        const artist = (s.artist_name || 'Samarid').trim();
        const featuring = (s.featuring || '').trim();
        currentArtistName = artist;
        const badge = s.verified ? VERIFY_BADGE : '';
        const downloadTitle = artist + (featuring ? ' Feat ' + featuring : '') + ' - ' + s.title;
        document.title = downloadTitle + ' - Samarid Music';

        const audioSrc = s.audio_url || s.downloadurl || '';

        let artistProfile = null;
        let followerCount = 0;
        try {
          const [profileRes, followsRes] = await Promise.all([
            fetch(SUPABASE_URL + '/rest/v1/artists?name=ilike.' + encodeURIComponent(artist) + '&limit=1', { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } }),
            fetch(SUPABASE_URL + '/rest/v1/follows?artist_name=ilike.' + encodeURIComponent(artist) + '&select=id', { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } })
          ]);
          const profileData = await profileRes.json();
          const followsData = await followsRes.json();
          if (Array.isArray(profileData) && profileData.length > 0) artistProfile = profileData[0];
          followerCount = Array.isArray(followsData) ? followsData.length : 0;
        } catch (e) { console.error(e); }

        let myFollow = false;
        try {
          const myFollowRes = await fetch(SUPABASE_URL + '/rest/v1/follows?artist_name=ilike.' + encodeURIComponent(artist) + '&visitor_id=eq.' + visitorId + '&select=id', { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } });
          const myFollowData = await myFollowRes.json();
          myFollow = Array.isArray(myFollowData) && myFollowData.length > 0;
        } catch (e) {}

        isFollowingArtist = myFollow;

        const profilePic = artistProfile && artistProfile.profile_pic ? artistProfile.profile_pic : null;
        const avatarHTML = profilePic ? '<img src="' + escapeHtml(profilePic) + '" alt="' + escapeHtml(artist) + '">' : escapeHtml(artist.charAt(0).toUpperCase());

        let artistsList = [];
        try {
          const artistsRes = await fetch(SUPABASE_URL + '/rest/v1/songs?select=artist_name,featuring,verified&or=(status.eq.live,status.is.null,release_at.lte.' + encodeURIComponent(nowIso) + ')', { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } });
          const artistsData = await artistsRes.json();
          const map = {};
          artistsData.forEach(a => {
            const n = (a.artist_name || 'Samarid').trim();
            if (!map[n]) map[n] = false;
            if (a.verified) map[n] = true;
            if (a.featuring && a.featuring.trim()) {
              a.featuring.split(',').map(x => x.trim()).filter(x => x).forEach(f => {
                if (!map[f]) map[f] = false;
              });
            }
          });
          artistsList = Object.keys(map).filter(n => n.toLowerCase() !== artist.toLowerCase()).sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase())).map(n => ({ name: n, verified: map[n] }));
        } catch (e) {}

        const artistsHTML = artistsList.map(a => '<a href="artist-template.html?name=' + encodeURIComponent(a.name) + '" class="artist-link">' + escapeHtml(a.name) + (a.verified ? VERIFY_BADGE : '') + '</a>').join('') || '<p style="text-align:center; color:#444; font-size:12px; grid-column:1/-1;">More artists coming soon.</p>';

        const shareText = encodeURIComponent('Listen to "' + s.title + '" by ' + artist + (featuring ? ' Feat ' + featuring : '') + ' on Samarid Music!');
        const shareUrl = encodeURIComponent(window.location.href);
        const artistLinksHTML = buildArtistLinks(artist, featuring, badge);

        container.innerHTML = `
          <div class="big-title">Download MP3 <span class="accent">${escapeHtml(downloadTitle)}</span></div>

          <div class="detail-cover-box"><img src="${escapeHtml(s.cover)}" alt="${escapeHtml(s.title)}"></div>

          <h1 class="detail-title">${escapeHtml(s.title)}</h1>
          <p class="detail-meta">
            ${artistLinksHTML}
            <span>•</span>
            <span>${escapeHtml(s.date || '')}</span>
            <span>•</span>
            <span>${escapeHtml(s.category || 'Music')}</span>
          </p>

          <div class="play-count-wrapper">
            <span class="play-count-badge" id="playCountBadge">🔥 ${s.plays || 0} plays</span>
          </div>

          <p class="detail-label"><i class="fas fa-compact-disc"></i> A Samarid Music Release</p>

          <div class="detail-description">
            <h4><i class="fas fa-info-circle"></i> About this Song</h4>
            <p>${escapeHtml(s.description || 'No description yet.')}</p>
          </div>

          <div class="presented-by">
            <strong>SAMARID MUSIC</strong> presents this track • © 2026 Samarid Music
          </div>

          <div class="audio-player-box">
            <h4>Listen Now</h4>
            <audio id="audioPlayer" src="${escapeHtml(audioSrc)}" preload="metadata"></audio>
            <button class="play-pause-btn" id="playPauseBtn" onclick="togglePlay()"><i class="fas fa-play"></i></button>
            <div class="seek-row">
              <span id="currentTime">0:00</span>
              <input type="range" id="seekSlider" value="0" max="100">
              <span id="duration">0:00</span>
            </div>
          </div>

          <div class="detail-section">
            <h4>Get the Song</h4>
            <div class="download-buttons">
              <button onclick="smartDownload(this)" class="btn-download" id="downloadBtn">
                <i class="fas fa-download"></i> Download MP3
              </button>
            </div>
          </div>

          <div class="follow-row-compact">
            <div class="follow-avatar-flat">${avatarHTML}</div>
            <div class="follow-info-flat">
              <a href="artist-template.html?name=${encodeURIComponent(artist)}" class="follow-name-flat">${escapeHtml(artist)}${badge}</a>
              <span class="follow-dot">·</span>
              <span class="follow-stats-flat"><span class="stat-num" id="followerCountNum">${followerCount.toLocaleString()}</span> <span id="followerCountLabel">followers</span></span>
            </div>
            <button class="follow-btn-flat ${myFollow ? 'following' : ''}" id="songFollowBtn" onclick="toggleFollowSong()">
              <i class="fas fa-${myFollow ? 'check' : 'plus'}" id="songFollowIcon"></i>
              <span id="songFollowText">${myFollow ? 'Following' : 'Follow'}</span>
            </button>
          </div>

          <div class="detail-section" style="text-align:center;">
            <h4>Show Some Love</h4>
            <button id="likeBtn" onclick="toggleLikeSong()" style="background:transparent; border:2px solid #eee; padding:12px 24px; border-radius:30px; cursor:pointer; display:inline-flex; align-items:center; gap:10px; font-family:inherit; font-size:15px; font-weight:800; color:#888;">
              <i class="far fa-heart" id="likeIcon" style="font-size:18px;"></i>
              <span id="likeCount">0</span> Likes
            </button>
          </div>

          <div class="share-section">
            <h4>Share this Song</h4>
            <div class="share-grid">
              <a href="https://wa.me/?text=${shareText}%20${shareUrl}" target="_blank" rel="noopener" class="share-btn share-whatsapp"><i class="fab fa-whatsapp"></i> WhatsApp</a>
              <a href="https://www.facebook.com/sharer/sharer.php?u=${shareUrl}" target="_blank" rel="noopener" class="share-btn share-facebook"><i class="fab fa-facebook"></i> Facebook</a>
              <a href="https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}" target="_blank" rel="noopener" class="share-btn share-twitter"><i class="fab fa-x-twitter"></i> X (Twitter)</a>
              <button onclick="copyLink()" class="share-btn share-copy"><i class="fas fa-link"></i> Copy Link</button>
            </div>
          </div>

          <div class="dark-section">
            <h3 class="dark-section-title">Samarid Music</h3>
            <p class="dark-section-subtitle">Record Label • Ghana</p>

            <div class="contact-box">
              <p class="contact-label">Contact / Bookings</p>
              <p class="contact-email">${escapeHtml(CONTACT_EMAIL)}</p>
              <p class="contact-hint">(Tap and hold to copy the email)</p>
            </div>

            <p class="artists-label">More Artists on Samarid Music</p>
            <div class="artists-list">${artistsHTML}</div>

            <p class="dark-footer-note">© 2026 SAMARID MUSIC • ALL RIGHTS RESERVED</p>
          </div>
        `;

        loadLikeState(s.id);
      } catch (e) {
        console.error(e);
        container.innerHTML = '<div class="error-box"><div class="icon">⚠️</div><h3>Error Loading Song</h3><p>' + escapeHtml(e.message || 'Something went wrong.') + '</p><a href="index.html">Go Home</a></div>';
      }
    }

    window.togglePlay = function() {
      const audio = document.getElementById('audioPlayer');
      const btn = document.getElementById('playPauseBtn');
      if (!audio || !btn) return;
      if (audio.paused) {
        audio.play().catch(() => { showToast('Tap play to start the audio'); });
        btn.innerHTML = '<i class="fas fa-pause"></i>';
        if (hasRecentPlay(currentSongData.id)) return;
        hasCountedThisPlay = false;
        secondsListened = 0;
        if (playCountTimer) clearInterval(playCountTimer);
        playCountTimer = setInterval(() => {
          secondsListened++;
          if (secondsListened >= PLAY_SECONDS_REQUIRED && !hasCountedThisPlay) {
            hasCountedThisPlay = true;
            incrementPlayCount();
            markPlayed(currentSongData.id);
            clearInterval(playCountTimer);
          }
        }, 1000);
      } else {
        audio.pause();
        btn.innerHTML = '<i class="fas fa-play"></i>';
        if (playCountTimer) { clearInterval(playCountTimer); playCountTimer = null; }
      }
    }

    async function incrementPlayCount() {
      if (!currentSongData) return;
      const newPlays = (currentSongData.plays || 0) + 1;
      currentSongData.plays = newPlays;
      const badge = document.getElementById('playCountBadge');
      if (badge) badge.innerHTML = '🔥 ' + newPlays + ' plays';
      try {
        await fetch(SUPABASE_URL + '/rest/v1/songs?id=eq.' + currentSongData.id, { method: 'PATCH', headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ plays: newPlays }) });
      } catch (e) { console.error('Play count save failed:', e); }
    }

    window.addEventListener('beforeunload', () => { if (playCountTimer) clearInterval(playCountTimer); });

    document.addEventListener('timeupdate', function(e) {
      if (e.target.id === 'audioPlayer') {
        const audio = e.target;
        const slider = document.getElementById('seekSlider');
        const currentTimeEl = document.getElementById('currentTime');
        if (audio.duration) {
          slider.value = (audio.currentTime / audio.duration) * 100;
          currentTimeEl.innerText = formatTime(audio.currentTime);
        }
      }
    }, true);

    document.addEventListener('loadedmetadata', function(e) {
      if (e.target.id === 'audioPlayer') {
        document.getElementById('duration').innerText = formatTime(e.target.duration);
      }
    }, true);

    document.addEventListener('input', function(e) {
      if (e.target.id === 'seekSlider') {
        const audio = document.getElementById('audioPlayer');
        audio.currentTime = (e.target.value / 100) * audio.duration;
      }
    });

    document.addEventListener('ended', function(e) {
      if (e.target.id === 'audioPlayer') {
        document.getElementById('playPauseBtn').innerHTML = '<i class="fas fa-play"></i>';
        document.getElementById('seekSlider').value = 0;
        document.getElementById('currentTime').innerText = '0:00';
        if (playCountTimer) { clearInterval(playCountTimer); playCountTimer = null; }
      }
    }, true);

    function formatTime(seconds) {
      if (isNaN(seconds)) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    async function loadLikeState(songId) {
      try {
        const [myLikeRes, allLikesRes] = await Promise.all([
          fetch(SUPABASE_URL + '/rest/v1/likes?song_id=eq.' + songId + '&visitor_id=eq.' + visitorId + '&select=id', { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } }),
          fetch(SUPABASE_URL + '/rest/v1/likes?song_id=eq.' + songId + '&select=id', { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } })
        ]);
        const myLike = await myLikeRes.json();
        const allLikes = await allLikesRes.json();
        isSongLiked = Array.isArray(myLike) && myLike.length > 0;
        updateLikeUI(Array.isArray(allLikes) ? allLikes.length : 0);
      } catch (e) { console.error('Like load error:', e); }
    }

    function updateLikeUI(count) {
      const btn = document.getElementById('likeBtn');
      const icon = document.getElementById('likeIcon');
      const countEl = document.getElementById('likeCount');
      if (!btn || !icon || !countEl) return;
      countEl.innerText = count;
      if (isSongLiked) { btn.style.borderColor = '#ff0033'; btn.style.color = '#ff0033'; btn.style.background = 'rgba(255,0,51,0.08)'; icon.classList.remove('far'); icon.classList.add('fas'); }
      else { btn.style.borderColor = '#eee'; btn.style.color = '#888'; btn.style.background = 'transparent'; icon.classList.remove('fas'); icon.classList.add('far'); }
    }

    window.toggleLikeSong = async function() {
      if (!currentSongData) return;
      const songId = currentSongData.id;
      const countEl = document.getElementById('likeCount');
      const currentCount = parseInt(countEl.innerText) || 0;
      isSongLiked = !isSongLiked;
      updateLikeUI(isSongLiked ? currentCount + 1 : Math.max(0, currentCount - 1));
      try {
        if (isSongLiked) {
          await fetch(SUPABASE_URL + '/rest/v1/likes', { method: 'POST', headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ song_id: songId, visitor_id: visitorId }) });
        } else {
          await fetch(SUPABASE_URL + '/rest/v1/likes?song_id=eq.' + songId + '&visitor_id=eq.' + visitorId, { method: 'DELETE', headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } });
        }
      } catch (e) { console.error('Like toggle failed:', e); }
    }

    window.toggleFollowSong = async function() {
      const btn = document.getElementById('songFollowBtn');
      const icon = document.getElementById('songFollowIcon');
      const text = document.getElementById('songFollowText');
      const countNum = document.getElementById('followerCountNum');
      btn.disabled = true;
      const currentCount = parseInt(countNum.innerText.replace(/,/g, '')) || 0;
      isFollowingArtist = !isFollowingArtist;
      const newCount = isFollowingArtist ? currentCount + 1 : Math.max(0, currentCount - 1);
      countNum.innerText = newCount.toLocaleString();
      if (isFollowingArtist) { btn.classList.add('following'); icon.className = 'fas fa-check'; text.innerText = 'Following'; }
      else { btn.classList.remove('following'); icon.className = 'fas fa-plus'; text.innerText = 'Follow'; }
      try {
        if (isFollowingArtist) {
          await fetch(SUPABASE_URL + '/rest/v1/follows', { method: 'POST', headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ artist_name: currentArtistName, visitor_id: visitorId }) });
        } else {
          await fetch(SUPABASE_URL + '/rest/v1/follows?artist_name=ilike.' + encodeURIComponent(currentArtistName) + '&visitor_id=eq.' + visitorId, { method: 'DELETE', headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } });
        }
      } catch (e) { isFollowingArtist = !isFollowingArtist; countNum.innerText = currentCount.toLocaleString(); }
      finally { btn.disabled = false; }
    }

    async function copyLink() {
      const url = window.location.href;
      try {
        if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(url); }
        else { const ta = document.createElement('textarea'); ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
        showToast('Link copied!');
      } catch (e) { showToast('Could not copy link'); }
    }

    function showToast(msg) {
      const toast = document.createElement('div');
      toast.innerText = msg;
      toast.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:12px 24px;border-radius:30px;font-size:14px;font-weight:600;z-index:99999;box-shadow:0 10px 30px rgba(0,0,0,0.3);max-width:calc(100vw - 40px);text-align:center;';
      document.body.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; }, 1800);
      setTimeout(() => { document.body.removeChild(toast); }, 2200);
    }

    loadSong();
  </script>
</body>
</html>
