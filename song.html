<script>
  (function() {
    try {
      var theme = localStorage.getItem('samarid-theme') || 'light';
      var isLight = (theme === 'light');
      document.documentElement.setAttribute('data-theme', theme);
      if (isLight) document.documentElement.classList.add('theme-light');

<style>
  :root { --bg: #0a0a0a; --card: #141414; --border: #222; --text: #ffffff; --text2: #cccccc; --accent: #ff0033; --header-bg: #111111; --dark: #0a0a0a; --soft-green: #8fdfa8; }
  html.theme-light, html[data-theme="light"] { --bg: #fafaf8; --card: #ffffff; --border: #ececec; --text: #0a0a0a; --text2: #666666; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; min-width: 0; }
  html { overflow-x: hidden; max-width: 100vw; }
  body { overflow-x: clip; max-width: 100vw; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding-bottom: 40px; transition: background 0.25s, color 0.25s; }
  img { max-width: 100%; }

  .header { position: sticky; top: 0; background: var(--header-bg); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
  .menu-btn { background: transparent; color: #fff; border: none; width: 40px; height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; flex-shrink: 0; padding: 0; transition: all 0.2s; }
  .menu-btn .bar { display: block; width: 24px; height: 3px; background: #999999; border-radius: 2px; transition: all 0.3s ease; transform-origin: center; }
  .menu-btn.open .bar:nth-child(1) { transform: translateY(8px) rotate(45deg); }
  .menu-btn.open .bar:nth-child(2) { opacity: 0; }
  .menu-btn.open .bar:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }
  .menu-btn.menu-open { position: fixed; top: 14px; left: 14px; z-index: 10001; }

  .logo { font-size: 18px; font-weight: 900; color: #fff; text-decoration: none; flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 8px; letter-spacing: -0.5px; }
  .logo span { color: var(--accent); }
  .header-spacer { width: 40px; flex-shrink: 0; }

  /* ===== MENU OVERLAY ===== */
  .menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9998; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
  .menu-overlay.open { opacity: 1; pointer-events: auto; }

  /* ===== SLIDE-IN MENU — LIGHT + CUT ===== */
  .menu-dropdown { position: fixed; top: 56px; left: -320px; width: 290px; max-width: 85vw; height: calc(100vh - 56px); background: #f7f7f7; border-right: 1px solid #e5e5e5; z-index: 9999; transition: left 0.32s cubic-bezier(0.4, 0, 0.2, 1); overflow-y: auto; box-shadow: 10px 0 40px rgba(0,0,0,0.15); padding-top: 12px; }
  .menu-dropdown.open { left: 0; }
  .menu-title { padding: 20px 26px 10px; font-size: 10px; color: #999; letter-spacing: 2.5px; font-weight: 800; text-transform: uppercase; border-top: 1px solid #e8e8e8; margin-top: 6px; }
  .menu-title:first-child { border-top: none; margin-top: 0; padding-top: 6px; }
  .menu-item { padding: 16px 26px; font-size: 16px; color: #0a0a0a; cursor: pointer; display: flex; align-items: center; gap: 14px; text-decoration: none; transition: background 0.15s; background: transparent; border: none; width: 100%; font-family: inherit; text-align: left; font-weight: 700; letter-spacing: -0.2px; }
  .menu-item:active { background: #ececec; }
  .menu-item .label { flex: 1; color: #0a0a0a; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 800; font-size: 16px; }
  .menu-item .arrow { color: #bbb; font-size: 12px; flex-shrink: 0; }
  .theme-row { padding: 14px 26px 18px; display: flex; align-items: center; justify-content: space-between; }
  .theme-label { font-size: 15px; color: #0a0a0a; font-weight: 700; }
  .theme-toggle { display: flex; gap: 6px; }
  .theme-btn { padding: 8px 14px; background: #ffffff; border: 1px solid #ddd; border-radius: 8px; color: #666; font-size: 12px; font-weight: 700; cursor: pointer; transition: all 0.15s; font-family: inherit; }
  .theme-btn.active { border-color: var(--accent); color: var(--accent); }

  .sub-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(5px); }
  .sub-modal.open { display: flex; }
  .sub-modal-inner { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 30px 24px; text-align: center; max-width: 340px; width: 100%; animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); }

  .sub-modal-btn { display: block; width: 100%; padding: 14px; border-radius: 12px; font-size: 14px; font-weight: 700; text-decoration: none; cursor: pointer; border: none; margin-bottom: 10px; }
  .sub-modal-btn.confirm { background: #ff0033; color: #ffffff; }
  .sub-modal-btn.close { background: transparent; color: var(--text2); font-size: 12px; }

  .container { max-width: 700px; margin: 0 auto; padding: 20px 16px; }

  .detail-cover-box { width: 100%; max-width: 300px; margin: 0 auto 25px; aspect-ratio: 1 / 1; border-radius: 0; overflow: hidden; border: 1px solid var(--border); box-shadow: 0 10px 30px rgba(0,0,0,0.12); background: #000; }

  /* ===== FIXED TITLE (removed duplicate rules) ===== */
  .detail-title { font-size: 22px; font-weight: 900; line-height: 1.35; margin-bottom: 6px; text-align: center; overflow-wrap: anywhere; word-break: break-word; color: var(--text); max-width: 340px; margin-left: auto; margin-right: auto; text-wrap: balance; }
  .detail-title .artist { color: var(--text); font-weight: 900; }
  .detail-meta { font-size: 13px; color: #999; margin-bottom: 8px; text-align: center; display: flex; align-items: center; justify-content: center; gap: 5px; flex-wrap: wrap; }

  .detail-title .artist { color: var(--text); font-weight: 900; display: inline-flex; align-items: center; gap: 4px; text-decoration: none !important; border: none !important; }
  .detail-meta .feat-link { color: #1d9bf0; font-weight: 700; text-decoration: none; }
  .detail-label { text-align: center; font-size: 11px; color: #999; margin-bottom: 25px; letter-spacing: 1px; font-weight: 600; text-transform: uppercase; }
  .detail-label i { color: var(--accent); margin-right: 4px; }
 .follow-row-compact { display: flex; align-items: center; gap: 10px; padding: 0; margin: 0; }

.profile-logo { background: #fff; color: #0a0a0a; font-size: 10px; font-weight: 900; letter-spacing: -0.3px; padding: 5px 8px; border: 1px solid #1c1c1c; border-radius: 0; line-height: 1; text-decoration: none; }
.profile-logo span { color: #ff0033; }

  .follow-dot { color: #bbb; font-weight: 700; font-size: 12px; flex-shrink: 0; }

  .follow-btn-flat { padding: 5px 11px; border-radius: 20px; font-size: 11px; font-weight: 800; border: none; background: linear-gradient(135deg, #ff0033 0%, #ff3366 100%); color: #fff; cursor: pointer; font-family: inherit; display: flex; align-items: center; gap: 5px; flex-shrink: 0; white-space: nowrap; }

 .follow-btn-flat.following { background: transparent; color: var(--accent); border: 1.5px solid var(--accent); padding: 3.5px 9.5px; }
  .detail-description { padding: 8px 4px 24px; margin-bottom: 12px; text-align: left; }
  .detail-description h4 { font-size: 11px; color: var(--text2); letter-spacing: 2px; text-transform: uppercase; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

  .detail-section { background: transparent; border: none; border-radius: 0; padding: 0; margin-top: 8px; margin-bottom: 30px; }

  /* ===== LYRICS SECTION — FIXED ===== */

        const res = await fetch(SUPABASE_URL + '/rest/v1/songs?id=eq.' + songId + '&or=(status.eq.live,status.is.null,release_at.lte.' + encodeURIComponent(new Date().toISOString()) + ')', { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } });
        const data = await res.json();

        if (!data || data.length === 0) {
          container.innerHTML = '<div class="error-box"><div class="icon">🔍</div><h3>Song Not Found</h3><p>This song doesn\'t exist or hasn\'t been released yet.</p><a href="index.html">Browse Songs</a></div>';
          return;
        }

        const s = data[0];
        currentSongData = s;
        const artist = (s.artist_name || 'Samarid').trim();
        const featuring = (s.featuring || '').trim();
        currentArtistName = artist;
        const badge = s.verified ? VERIFY_BADGE : '';
        const downloadTitle = artist + (featuring ? ' Feat ' + featuring : '') + ' - ' + s.title;
        document.title = downloadTitle + ' - FlexTune';

        const audioSrc = s.audio_url || s.downloadurl || '';

        let artistProfile = null;
        let followerCount = 0;
        try {
          const [profileRes, followsRes] = await Promise.all([
            fetch(SUPABASE_URL + '/rest/v1/artists?name=ilike.' + encodeURIComponent(artist) + '&limit=1', { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } }),
            fetch(SUPABASE_URL + '/rest/v1/follows?artist_name=ilike.' + encodeURIComponent(artist) + '&select=id', { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } })
          ]);
          const profileData = await profileRes.json();
          const followsData = await followsRes.json();
          if (Array.isArray(profileData) && profileData.length > 0) artistProfile = profileData[0];
          followerCount = Array.isArray(followsData) ? followsData.length : 0;
        } catch (e) { console.error(e); }

        let myFollow = false;
        try {
          const myFollowRes = await fetch(SUPABASE_URL + '/rest/v1/follows?artist_name=ilike.' + encodeURIComponent(artist) + '&visitor_id=eq.' + visitorId + '&select=id', { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } });
          const myFollowData = await myFollowRes.json();
          myFollow = Array.isArray(myFollowData) && myFollowData.length > 0;
        } catch (e) {}

        isFollowingArtist = myFollow;

        const profilePic = artistProfile && artistProfile.profile_pic ? artistProfile.profile_pic : null;
        const avatarHTML = profilePic ? '<img src="' + escapeHtml(profilePic) + '" alt="' + escapeHtml(artist) + '">' : escapeHtml(artist.charAt(0).toUpperCase());

        let artistsList = [];
        try {
          const artistsRes = await fetch(SUPABASE_URL + '/rest/v1/songs?select=artist_name,featuring,verified&or=(status.eq.live,status.is.null,release_at.lte.' + encodeURIComponent(nowIso) + ')', { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } });
          const artistsData = await artistsRes.json();
          const map = {};
          artistsData.forEach(a => {
            const n = (a.artist_name || 'Samarid').trim();
            if (!map[n]) map[n] = false;
            if (a.verified) map[n] = true;
            if (a.featuring && a.featuring.trim()) {
              a.featuring.split(',').map(x => x.trim()).filter(x => x).forEach(f => {
                if (!map[f]) map[f] = false;
              });
            }
          });
          artistsList = Object.keys(map).filter(n => n.toLowerCase() !== artist.toLowerCase()).sort((a, b) => a.toLowerCase().localeCompare(b.toLowerCase())).map(n => ({ name: n, verified: map[n] }));
        } catch (e) {}

        const artistsHTML = artistsList.map(a => '<a href="artist-template.html?name=' + encodeURIComponent(a.name) + '" class="artist-link">' + escapeHtml(a.name) + (a.verified ? VERIFY_BADGE : '') + '</a>').join('') || '<p style="text-align:center; color:#444; font-size:12px; grid-column:1/-1;">More artists coming soon.</p>';

        const shareText = encodeURIComponent('Listen to "' + s.title + '" by ' + artist + (featuring ? ' Feat ' + featuring : '') + ' on FlexTune!');
        const shareUrl = encodeURIComponent(window.location.href);
        const artistLinksHTML = buildArtistLinks(artist, featuring, badge);

        container.innerHTML = `
          <div class="big-title">Download MP3 <span class="accent">${escapeHtml(downloadTitle)}</span></div>

          <div class="detail-cover-box"><img src="${escapeHtml(s.cover)}" alt="${escapeHtml(s.title)}"></div>

          <h1 class="detail-title">${escapeHtml(s.title)} <span class="detail-by">By</span><br class="title-break">${artistLinksHTML}</h1>
          <p class="detail-meta">
            <span>${escapeHtml(s.date || '')}</span>
            <span>•</span>
            <span>${escapeHtml(s.category || 'Music')}</span>
          </p>

          <p class="detail-label"><i class="fas fa-compact-disc"></i> A FlexTune Release</p>

          <div class="detail-description">
            <h4><i class="fas fa-info-circle"></i> About this Song</h4>
            <p>${escapeHtml(s.description || 'No description yet.')}</p>
          </div>

          <div class="lyrics-section" id="lyricsSection" style="display:none;">
            <h4><i class="fas fa-music"></i> Lyrics</h4>
            <div class="lyrics-scroll" id="lyricsScroll"></div>
          </div>

         <div class="release-note">
            <div class="release-note-divider"></div>
            <div class="release-note-title">About This Release</div>
            <p>"${escapeHtml(s.title)}" by ${escapeHtml(artist)} is now available to stream and download for free on FlexTune, Africa's Music Hub. Press play below to listen, then download the MP3 to keep it on your phone.</p>
            <p>FlexTune is built to help fans discover fresh music and to help artists get heard. If you enjoy this song, follow ${escapeHtml(artist)}, share it with your friends, and check out more music from the artist below.</p>
            <p>Every song on FlexTune is shared to give artists a real platform. When you stream "${escapeHtml(s.title)}", download it, or send it to a friend, you help ${escapeHtml(artist)} reach more people and grow their music career.</p>
            <p>Music is the heartbeat of Africa. From the streets to the studio, new sounds are being created every day, and FlexTune is here to bring them all to you in one place, fast and free.</p>
            <p>Love this track? Turn the volume up, add it to your playlist, and tell someone about it. Your support is what keeps the music moving.</p>
            <p>Thank you for supporting African music.</p>
          </div>

          <div class="audio-player-box">
            <audio id="audioPlayer" src="${escapeHtml(audioSrc)}" preload="metadata"></audio>
            <div class="player-row">
              <button class="play-pause-btn" id="playPauseBtn" onclick="togglePlay()"><i class="fas fa-play"></i></button>
              <input type="range" id="seekSlider" value="0" max="100">
              <span id="currentTime" class="player-time">0:00</span>
              <span id="duration" class="player-time">0:00</span>
            </div>
          </div>

          <div class="detail-section">
            <div class="download-buttons">
              <button onclick="document.getElementById('audioPlayer').scrollIntoView({behavior:'smooth',block:'center'}); togglePlay()" class="btn-download btn-play">
                Play Now <i class="fas fa-play"></i>
              </button>
              <button onclick="smartDownload(this)" class="btn-download" id="downloadBtn">
                Download Mp3 <i class="fas fa-download"></i>
              </button>
            </div>
          </div>

          <div class="profile-card">
         <div class="profile-card-head"><span>Artist Profile</span><a href="index.html" class="profile-logo">FLEX<span>TUNE</span></a></div>
          <div class="profile-card-body">
          <div class="follow-row-compact">
            <div class="follow-avatar-flat">${avatarHTML}</div>
            <div class="follow-info-flat">
              <a href="artist-template.html?name=${encodeURIComponent(artist)}" class="follow-name-flat">${escapeHtml(artist)}${badge}</a>
              <span class="follow-dot">·</span>
              <span class="follow-stats-flat"><span class="stat-num" id="followerCountNum">${followerCount.toLocaleString()}</span> <span id="followerCountLabel">followers</span></span>
            </div>
            <button class="follow-btn-flat ${myFollow ? 'following' : ''}" id="songFollowBtn" onclick="toggleFollowSong()">
              <i class="fas fa-${myFollow ? 'check' : 'plus'}" id="songFollowIcon"></i>
              <span id="songFollowText">${myFollow ? 'Following' : 'Follow'}</span>
            </button>
          </div>

         </div>
          </div>

          <div class="more-from-section" id="moreFromSection" style="display:none;">
            <h4 id="moreFromTitle"><i class="fas fa-music"></i> More From</h4>
            <div class="more-from-list" id="moreFromList"></div>
          </div>

          <div class="share-section">
            <h4><i class="fas fa-share-nodes"></i> Share this Song</h4>
            <div class="share-grid">
              <a href="https://wa.me/?text=${shareText}%20${shareUrl}" target="_blank" rel="noopener" class="share-btn share-whatsapp"><i class="fab fa-whatsapp"></i> WhatsApp</a>
              <a href="https://www.facebook.com/sharer/sharer.php?u=${shareUrl}" target="_blank" rel="noopener" class="share-btn share-facebook"><i class="fab fa-facebook"></i> Facebook</a>
              <a href="https://twitter.com/intent/tweet?text=${shareText}&url=${shareUrl}" target="_blank" rel="noopener" class="share-btn share-twitter"><i class="fab fa-x-twitter"></i> X (Twitter)</a>
              <button onclick="copyLink()" class="share-btn share-copy"><i class="fas fa-link"></i> Copy Link</button>
            </div>
          </div>

          <div class="email-compact-box">
            <div id="songEmailFormArea">
              <div class="email-compact-title"><i class="fas fa-envelope-open-text"></i> Never Miss A Drop</div>
              <div class="email-compact-sub">Get notified whenever new music drops from FlexTune.</div>
              <div class="email-compact-form">
                <input type="email" id="songEmailInput" class="email-compact-input" placeholder="your@email.com" onkeypress="if(event.key==='Enter')submitSongEmail()">
                <button class="email-compact-btn" id="songEmailBtn" onclick="submitSongEmail()"><i class="fas fa-bell"></i> Notify</button>
              </div>
            </div>
            <div id="songEmailSuccess" class="email-compact-success">
              <div class="title">Subscribed!</div>
              <div class="text">You'll be notified when new songs drop.</div>
            </div>
          </div>

          <div class="promo-black-section">
            <div class="promo-inner">
              <div class="promo-tagline">
                <div class="promo-label">Sponsored</div>
                <h2>Promote Your Music <span>To Thousands</span></h2>
                <p>Reach real music lovers across Ghana, Nigeria, and beyond. Get your brand, song, or business seen by fans every single day. Your photo and story could be featured right here.</p>
              </div>

              <div class="promo-ads-container" id="promoAdsContainer">
                <div class="promo-ad-placeholder">
                  <i class="fas fa-image"></i>
                  <p>Your ad could be here</p>
                </div>
              </div>

              <div class="promo-cta-wrap">
                <a href="promo.html" class="promo-cta">
                  <i class="fas fa-bullhorn"></i> Get Featured
                </a>
              </div>
            </div>
          </div>

          <div class="dark-section">
            <h3 class="dark-section-title">FlexTune</h3>
            <p class="dark-section-subtitle">Africa's Music Hub</p>

            <div class="contact-box">
              <p class="contact-label">Contact / Bookings</p>
              <p class="contact-email">${escapeHtml(CONTACT_EMAIL)}</p>
              <p class="contact-hint">(Tap and hold to copy the email)</p>
            </div>

            <p class="artists-label">More Artists on FlexTune</p>
            <div class="artists-list">${artistsHTML}</div>

            <p class="dark-footer-note">© 2026 FLEXTUNE • ALL RIGHTS RESERVED</p>
          </div>
        `;

        renderLyrics(s.lyrics);
        loadMoreFromArtist(artist, s.id);
        loadAds();
      } catch (e) {
        console.error(e);
        container.innerHTML = '<div class="error-box"><div class="icon">⚠️</div><h3>Error Loading Song</h3><p>' + escapeHtml(e.message || 'Something went wrong.') + '</p><a href="index.html">Go Home</a></div>';
      }
    }

    window.togglePlay = function() {
      const audio = document.getElementById('audioPlayer');
      const btn = document.getElementById('playPauseBtn');
      if (!audio || !btn) return;
      if (audio.paused) {
        audio.play().then(() => {
          btn.innerHTML = '<i class="fas fa-pause"></i>';
          if (hasRecentPlay(currentSongData.id)) return;
          hasCountedThisPlay = false;
          secondsListened = 0;
          if (playCountTimer) clearInterval(playCountTimer);
          playCountTimer = setInterval(() => {
            secondsListened++;
            if (secondsListened >= PLAY_SECONDS_REQUIRED && !hasCountedThisPlay) {
              hasCountedThisPlay = true;
              incrementPlayCount();
              markPlayed(currentSongData.id);
              clearInterval(playCountTimer);
            }
          }, 1000);
        }).catch(() => {
          showToast('Tap play to start the audio');
        });
      } else {
        audio.pause();
        btn.innerHTML = '<i class="fas fa-play"></i>';
        if (playCountTimer) { clearInterval(playCountTimer); playCountTimer = null; }
      }
    }

    async function incrementPlayCount() {
      if (!currentSongData) return;
      const newPlays = (currentSongData.plays || 0) + 1;
      currentSongData.plays = newPlays;
      try {
        await fetch(SUPABASE_URL + '/rest/v1/songs?id=eq.' + currentSongData.id, { method: 'PATCH', headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ plays: newPlays }) });
      } catch (e) { console.error('Play count save failed:', e); }
    }

    window.addEventListener('beforeunload', () => { if (playCountTimer) clearInterval(playCountTimer); });

    document.addEventListener('timeupdate', function(e) {
      if (e.target.id === 'audioPlayer') {
        const audio = e.target;
        const slider = document.getElementById('seekSlider');
        const currentTimeEl = document.getElementById('currentTime');
        if (audio.duration) {
          slider.value = (audio.currentTime / audio.duration) * 100;
          currentTimeEl.innerText = formatTime(audio.currentTime);
        }
      }
    }, true);
    document.addEventListener('loadedmetadata', function(e) {
      if (e.target.id === 'audioPlayer') {
        document.getElementById('duration').innerText = formatTime(e.target.duration);
      }
    }, true);

    document.addEventListener('input', function(e) {
      if (e.target.id === 'seekSlider') {
        const audio = document.getElementById('audioPlayer');
        audio.currentTime = (e.target.value / 100) * audio.duration;
      }
    });

    document.addEventListener('ended', function(e) {
      if (e.target.id === 'audioPlayer') {
        document.getElementById('playPauseBtn').innerHTML = '<i class="fas fa-play"></i>';
        document.getElementById('seekSlider').value = 0;
        document.getElementById('currentTime').innerText = '0:00';
        if (playCountTimer) { clearInterval(playCountTimer); playCountTimer = null; }
      }
    }, true);

    function formatTime(seconds) {
      if (isNaN(seconds)) return '0:00';
      const m = Math.floor(seconds / 60);
      const s = Math.floor(seconds % 60);
      return m + ':' + (s < 10 ? '0' : '') + s;
    }

    function renderLyrics(lyricsText) {
      const section = document.getElementById('lyricsSection');
      const container = document.getElementById('lyricsScroll');
      if (!section || !container) return;

      if (!lyricsText || !lyricsText.trim()) {
        section.style.display = 'none';
        return;
      }

      const lines = lyricsText.split('\n').map(l => l.trim()).filter(l => l.length > 0);

      if (lines.length === 0) {
        section.style.display = 'none';
        return;
      }

      container.innerHTML = lines.map(line =>
        '<div class="lyric-line">' + escapeHtml(line) + '</div>'
      ).join('');

      section.style.display = 'block';
    }

    async function loadMoreFromArtist(artistName, currentSongId) {
      const section = document.getElementById('moreFromSection');
      const list = document.getElementById('moreFromList');
      const titleEl = document.getElementById('moreFromTitle');
      if (!section || !list || !titleEl) return;

      if (!artistName) {
        section.style.display = 'none';
        return;
      }

      try {
        const res = await fetch(
  SUPABASE_URL + '/rest/v1/songs?artist_name=eq.' + encodeURIComponent(artistName) + '&id=neq.' + currentSongId + '&select=id,title,artist_name&order=id.desc&limit=5&or=(status.eq.live,status.is.null,release_at.lte.' + encodeURIComponent(new Date().toISOString()) + ')',
  { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } }
);
        const songs = await res.json();

        if (!Array.isArray(songs) || songs.length === 0) {
          section.style.display = 'none';
          return;
        }

        titleEl.innerHTML = '<i class="fas fa-music"></i> More From ' + escapeHtml(artistName);

        list.innerHTML = songs.map(s => `
          <a href="song.html?id=${s.id}" class="more-from-item">
            <span class="mf-title">${escapeHtml(s.title)}</span>
            <span class="mf-by">by</span>
            <span class="mf-artist">${escapeHtml(s.artist_name || artistName)}</span>
          </a>
        `).join('');
        section.style.display = 'block';
      } catch (e) {
        console.error('More From fetch failed:', e);
        section.style.display = 'none';
      }
    }

    async function copyLink() {
      const url = window.location.href;
      try {
        if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(url); }
        else { const ta = document.createElement('textarea'); ta.value = url; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); document.body.removeChild(ta); }
        showToast('Link copied!');
      } catch (e) { showToast('Could not copy link'); }
    }

    window.toggleFollowSong = async function() {
  if (!currentArtistName) return;
  const btn = document.getElementById('songFollowBtn');
  const icon = document.getElementById('songFollowIcon');
  const text = document.getElementById('songFollowText');
  const countEl = document.getElementById('followerCountNum');
  if (!btn || !icon || !text || !countEl) return;

  const wasFollowing = isFollowingArtist;
  isFollowingArtist = !wasFollowing;
  btn.disabled = true;

  const currentCount = parseInt(countEl.innerText.replace(/,/g, '')) || 0;
  const newCount = wasFollowing ? Math.max(0, currentCount - 1) : currentCount + 1;
  countEl.innerText = newCount.toLocaleString();
  btn.classList.toggle('following', isFollowingArtist);
  icon.className = 'fas fa-' + (isFollowingArtist ? 'check' : 'plus');
  text.innerText = isFollowingArtist ? 'Following' : 'Follow';

  try {
    if (isFollowingArtist) {
      await fetch(SUPABASE_URL + '/rest/v1/follows', {
        method: 'POST',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify({ artist_name: currentArtistName, visitor_id: visitorId })
      });
    } else {
      await fetch(SUPABASE_URL + '/rest/v1/follows?artist_name=ilike.' + encodeURIComponent(currentArtistName) + '&visitor_id=eq.' + visitorId, {
        method: 'DELETE',
        headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
      });
    }
  } catch (e) {
    isFollowingArtist = wasFollowing;
    countEl.innerText = currentCount.toLocaleString();
    btn.classList.toggle('following', wasFollowing);
    icon.className = 'fas fa-' + (wasFollowing ? 'check' : 'plus');
    text.innerText = wasFollowing ? 'Following' : 'Follow';
    showToast('Could not update follow state');
  } finally {
    btn.disabled = false;
  }
};

function showToast(msg) {
      const toast = document.createElement('div');
      toast.innerText = msg;
      toast.style.cssText = 'position:fixed;bottom:30px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:12px 24px;border-radius:30px;font-size:14px;font-weight:600;z-index:99999;box-shadow:0 10px 30px rgba(0,0,0,0.3);max-width:calc(100vw - 40px);text-align:center;transition:opacity 0.3s ease;';
      document.body.appendChild(toast);
      setTimeout(() => { toast.style.opacity = '0'; }, 1800);
      setTimeout(() => { if (toast.parentNode) document.body.removeChild(toast); }, 2200);
    }

    loadPageBuilderBlocks();
    loadSong();
  </script>
</body>
</html>
