<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Songs - Samarid Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { --bg: #f2f2f2; --card: #ffffff; --border: #e0e0e0; --text: #1a1a1a; --text2: #666666; --accent: #ff0033; --header-bg: #111111; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; padding-bottom: 40px; }
  .header { position: sticky; top: 0; background: var(--header-bg); padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
  .menu-btn { width: 38px; height: 38px; border-radius: 50%; background: #222; border: 1px solid #333; display: flex; align-items: center; justify-content: center; color: #fff; font-size: 18px; cursor: pointer; }
  .logo { font-size: 18px; font-weight: 900; color: #fff; text-decoration: none; flex: 1; text-align: center; }
  .logo span { color: var(--accent); }
  .home-btn { background: var(--accent); color: #fff; padding: 6px 12px; border-radius: 14px; font-size: 11px; font-weight: 700; text-decoration: none; }
  .menu-dropdown { position: fixed; top: 58px; left: 12px; background: #fff; border: 1px solid var(--border); border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,0.15); width: 260px; display: none; z-index: 9999; }
  .menu-dropdown.open { display: block; }
  .menu-item { padding: 12px 18px; display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text); border-bottom: 1px solid var(--border); font-size: 13px; }
  .menu-item:last-child { border-bottom: none; }
  .container { max-width: 700px; margin: 0 auto; padding: 20px 16px; }
  .page-title { font-size: 18px; font-weight: 900; text-align: center; padding: 20px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px; }
  .song-list { display: flex; flex-direction: column; gap: 12px; }
  .song-card { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; cursor: pointer; }
  .song-card-img { width: 130px; height: 130px; flex-shrink: 0; background: #000; }
  .song-card-img img { width: 100%; height: 100%; object-fit: cover; }
  .song-card-info { flex: 1; padding: 12px; display: flex; flex-direction: column; justify-content: center; }
  .song-card-cat { font-size: 11px; color: #d4a017; font-weight: 600; margin-bottom: 4px; }
  .song-card-info h3 { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
  .song-card-info .date { font-size: 12px; color: #999; }
  .empty-state { text-align: center; padding: 80px 20px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; color: var(--text2); }
  .empty-state .icon { font-size: 50px; margin-bottom: 15px; }
  .detail-view { display: none; }
  .detail-view.open { display: block; }
  .back-btn { background: var(--card); border: 1px solid var(--border); color: var(--text); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; margin-bottom: 20px; }
  .detail-cover { width: 100%; aspect-ratio: 1/1; border-radius: 12px; overflow: hidden; background: #000; border: 1px solid var(--border); margin-bottom: 25px; box-shadow: 0 15px 40px rgba(0,0,0,0.15); }
  .detail-cover img { width: 100%; height: 100%; object-fit: cover; }
  .detail-title { font-size: 24px; font-weight: 900; margin-bottom: 8px; }
  .detail-meta { font-size: 13px; color: #999; margin-bottom: 25px; }
  .detail-section { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; }
  .detail-section h4 { font-size: 12px; color: var(--text2); letter-spacing: 2px; text-transform: uppercase; font-weight: 700; margin-bottom: 12px; }
  .detail-section p { font-size: 15px; line-height: 1.7; }
  .download-buttons { display: flex; flex-direction: column; gap: 12px; }
  .btn-download, .btn-play { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px; border-radius: 10px; font-size: 15px; font-weight: 700; text-decoration: none; color: #fff; background: #e74c3c; }
  .footer { padding: 30px; text-align: center; font-size: 11px; color: var(--text2); border-top: 1px solid var(--border); margin-top: 40px; background: var(--card); }
  .footer .brand { color: var(--accent); font-weight: 700; }
  .hidden { display: none !important; }
</style>
</head>
<body>

  <header class="header">
    <button class="menu-btn" onclick="toggleMenu(event)">☰</button>
    <a href="index.html" class="logo">SAMARID <span>MUSIC</span></a>
    <a href="index.html" class="home-btn">HOME</a>
  </header>

  <div class="menu-dropdown" id="menuDropdown">
    <a href="index.html" class="menu-item"><i class="fas fa-home" style="color:#ff0033;"></i> Home</a>
    <a href="songs.html" class="menu-item"><i class="fas fa-music" style="color:#00cc44;"></i> My Songs</a>
  </div>

  <div class="container">
    <div id="listView">
      <div class="page-title">Browse - Samarid Music</div>
      <div class="song-list" id="songList"></div>
    </div>

    <div class="detail-view" id="detailView">
      <button class="back-btn" onclick="closeDetail()">← Back to Songs</button>
      <div class="detail-cover"><img id="detailCover" src=""></div>
      <h1 class="detail-title" id="detailTitle"></h1>
      <p class="detail-meta" id="detailMeta"></p>
      <div class="detail-section">
        <h4>📖 About this Song</h4>
        <p id="detailDescription"></p>
      </div>
      <div class="detail-section">
        <h4>⬇️ Get the Song</h4>
        <div class="download-buttons">
          <a href="#" id="detailDownload" class="btn-download" target="_blank"><i class="fas fa-download"></i> Download Mp3</a>
          <a href="#" id="detailPlay" class="btn-play" target="_blank"><i class="fas fa-play"></i> Play Now</a>
        </div>
      </div>
    </div>
  </div>

  <footer class="footer"><span class="brand">SAMARID MUSIC</span> © 2026</footer>

  <script>
    const songs = JSON.parse(localStorage.getItem('samarid_songs') || '[]');
    function toggleMenu(e) { e.stopPropagation(); document.getElementById('menuDropdown').classList.toggle('open'); }
    document.addEventListener('click', () => document.getElementById('menuDropdown').classList.remove('open'));

    function renderSongs() {
      const list = document.getElementById('songList');
      if (songs.length === 0) {
        list.innerHTML = `<div class="empty-state"><div class="icon">🎵</div><h3>No Songs Yet</h3><p>Check back soon!</p></div>`;
        return;
      }
      list.innerHTML = songs.map((s, i) => `
        <div class="song-card" onclick="openDetail(${i})">
          <div class="song-card-img"><img src="${s.cover}"></div>
          <div class="song-card-info">
            <div class="song-card-cat">${s.category} • Listen</div>
            <h3>${s.title}</h3>
            <div class="date">${s.date}</div>
          </div>
        </div>
      `).join('');
    }

    function openDetail(i) {
      const s = songs[i];
      document.getElementById('detailCover').src = s.cover;
      document.getElementById('detailTitle').innerText = s.title;
      document.getElementById('detailMeta').innerText = s.date + ' • ' + s.category;
      document.getElementById('detailDescription').innerText = s.description;
      document.getElementById('detailDownload').href = s.downloadUrl;
      document.getElementById('detailPlay').href = s.playUrl;
      document.getElementById('listView').classList.add('hidden');
      document.getElementById('detailView').classList.add('open');
      window.scrollTo(0,0);
    }
    function closeDetail() {
      document.getElementById('listView').classList.remove('hidden');
      document.getElementById('detailView').classList.remove('open');
      window.scrollTo(0,0);
    }
    renderSongs();
  </script>
</body>
</html>
