<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Albums - Samarid Music</title>
<meta name="description" content="Browse all albums from Samarid Music — Ghana's newest music label.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { --bg: #ffffff; --border: #e5e5e5; --text: #0a0a0a; --text2: #666; --accent: #ff8800; --red: #ff0033; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; min-width: 0; }
  html, body { overflow-x: hidden; max-width: 100vw; }
  body { background: #fafafa; color: var(--text); font-family: 'Inter', -apple-system, Roboto, sans-serif; min-height: 100vh; padding-bottom: 40px; }
  img { max-width: 100%; }

  .header { position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; gap: 8px; z-index: 100; }
  .menu-btn { background: transparent; color: var(--text); border: none; width: 40px; height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; flex-shrink: 0; padding: 0; }
  .menu-btn span { display: block; width: 22px; height: 2px; background: var(--text); border-radius: 2px; transition: background 0.2s; }
  .menu-btn:active span { background: var(--accent); }
  .logo { font-size: 18px; font-weight: 900; color: var(--text); text-decoration: none; flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 8px; }
  .logo span { color: var(--red); }
  .header-spacer { width: 40px; flex-shrink: 0; }

  .menu-dropdown { position: fixed; top: 66px; left: 12px; background: #141414; border: 1px solid #2a2a2a; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.7); width: 250px; max-width: calc(100vw - 24px); max-height: 70vh; overflow-y: auto; display: none; z-index: 9999; }
  .menu-dropdown.open { display: block; animation: menuPop 0.2s ease; }
  @keyframes menuPop { from { opacity: 0; transform: translateY(-8px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .menu-title { padding: 14px 18px 8px; font-size: 10px; color: #666; letter-spacing: 2px; font-weight: 700; text-transform: uppercase; }
  .menu-item { padding: 13px 18px; font-size: 14px; color: #fff; cursor: pointer; display: flex; align-items: center; gap: 12px; text-decoration: none; transition: background 0.15s; background: transparent; border: none; width: 100%; font-family: inherit; text-align: left; }
  .menu-item:active { background: #1f1f1f; }
  .menu-item i { width: 20px; text-align: center; font-size: 15px; color: var(--red); flex-shrink: 0; }
  .menu-item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu-divider { height: 1px; background: #222; margin: 4px 0; }
  .menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9998; display: none; }
  .menu-overlay.open { display: block; }

  .page-content { padding: 20px 16px 30px; max-width: 700px; margin: 0 auto; }

  .page-title { font-size: 26px; font-weight: 900; letter-spacing: -0.8px; margin-bottom: 6px; color: var(--text); overflow-wrap: anywhere; }
  .page-subtitle { font-size: 13px; color: var(--text2); margin-bottom: 22px; line-height: 1.5; }

  .albums-list { display: flex; flex-direction: column; }
  .album-card { display: flex; gap: 14px; padding: 14px 0; background: transparent; border: none; border-bottom: 1px solid var(--border); cursor: pointer; text-decoration: none; color: inherit; align-items: center; transition: opacity 0.15s; }
  .album-card:last-child { border-bottom: none; }
  .album-card:active { opacity: 0.7; }

  .album-cover { width: 115px; height: 115px; flex-shrink: 0; overflow: hidden; background: #000; border-radius: 14px; position: relative; }
  .album-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .album-new-badge { position: absolute; top: 8px; left: 8px; background: linear-gradient(135deg, #ff8800, #cc6600); color: #fff; font-size: 9px; font-weight: 900; padding: 3px 8px; border-radius: 10px; letter-spacing: 1px; box-shadow: 0 3px 10px rgba(255, 136, 0, 0.45); z-index: 2; }

  .album-info { flex: 1; display: flex; flex-direction: column; justify-content: center; min-width: 0; gap: 6px; }
  .album-artist { font-size: 11px; font-weight: 800; color: var(--accent); letter-spacing: 0.5px; text-transform: uppercase; display: flex; align-items: center; gap: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .album-artist .dot { color: var(--text2); font-weight: 700; }
  .album-name { font-size: 15px; font-weight: 900; line-height: 1.35; color: var(--text); letter-spacing: -0.3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; word-break: break-word; max-width: 100%; }
  .album-date { font-size: 12.5px; color: var(--text2); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .album-songs { font-size: 12px; color: var(--accent); font-weight: 800; display: flex; align-items: center; gap: 5px; margin-top: 2px; }
  .album-songs i { font-size: 11px; }

  .verify-badge { display: inline-block; width: 14px; height: 14px; vertical-align: middle; flex-shrink: 0; }

  .loading, .empty { text-align: center; padding: 60px 20px; color: #999; font-size: 13px; }
  .empty-state { text-align: center; padding: 50px 20px; background: #fff; border: 1px solid var(--border); border-radius: 16px; color: #999; }
  .empty-state .icon { font-size: 50px; margin-bottom: 15px; }
  .empty-state h3 { font-size: 17px; margin-bottom: 8px; color: var(--text); font-weight: 900; }

  .end-marker { text-align: center; padding: 30px 20px 20px; font-size: 11px; color: #bbb; letter-spacing: 2px; font-weight: 700; text-transform: uppercase; }

  .footer { padding: 30px 20px; text-align: center; font-size: 11px; color: #888; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; border-top: 1px solid var(--border); margin-top: 30px; }
  .footer .brand { color: var(--red); font-weight: 900; }
</style>
</head>
<body>

  <header class="header">
    <button class="menu-btn" onclick="toggleMenu(event)" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <a href="index.html" class="logo">SAMARID <span>MUSIC</span></a>
    <div class="header-spacer"></div>
  </header>

  <div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>
  <div class="menu-dropdown" id="menuDropdown" onclick="event.stopPropagation()">
    <div class="menu-title">Navigation</div>
    <a href="index.html" class="menu-item"><i class="fas fa-music"></i><span class="label">Music</span></a>
    <a href="search.html" class="menu-item"><i class="fas fa-search"></i><span class="label">Search</span></a>
    <a href="weekend.html" class="menu-item"><i class="fas fa-fire"></i><span class="label">Weekend Trend</span></a>
    <a href="albums.html" class="menu-item"><i class="fas fa-compact-disc"></i><span class="label">Albums</span></a>
    <a href="artists.html" class="menu-item"><i class="fas fa-user-group"></i><span class="label">Artists</span></a>
    <a href="videos.html" class="menu-item"><i class="fas fa-video"></i><span class="label">Videos</span></a>
    <div class="menu-divider"></div>
    <div class="menu-title">More</div>
    <a href="about.html" class="menu-item"><i class="fas fa-info-circle"></i><span class="label">About</span></a>
    <a href="promo.html" class="menu-item"><i class="fas fa-bullhorn"></i><span class="label">Promo</span></a>
    <a href="distributors.html" class="menu-item"><i class="fas fa-headphones"></i><span class="label">Get On Spotify</span></a>
  </div>

  <div class="page-content">
    <h1 class="page-title">Latest Albums</h1>
    <p class="page-subtitle">The newest drops from Samarid Music — tap any album to see all songs.</p>

    <div class="albums-list" id="albumsList">
      <div class="loading">Loading albums...</div>
    </div>

    <div class="end-marker" id="endMarker" style="display:none;">— You've Reached The End —</div>
  </div>

  <footer class="footer"><span class="brand">SAMARID MUSIC</span> © 2026</footer>

  <script>
    const SUPABASE_URL = "https://kamnfnukaizdglntcdvi.supabase.co";
    const SUPABASE_KEY = "sb_publishable__YPveWCU1NMYYsegLLYskg_38s0VRip";
    const NEW_DAYS = 14;

    const VERIFY_BADGE = '<svg class="verify-badge" viewBox="0 0 22 22"><path fill="#1d9bf0" d="M20.396 11c-.018-.646-.215-1.275-.57-1.816-.354-.54-.852-.972-1.438-1.246.223-.607.27-1.264.14-1.897-.131-.634-.437-1.218-.882-1.687-.47-.445-1.053-.75-1.687-.882-.633-.13-1.29-.083-1.897.14-.273-.587-.704-1.086-1.245-1.44S11.647 1.62 11 1.604c-.646.017-1.273.213-1.813.568s-.969.854-1.24 1.44c-.608-.223-1.267-.272-1.902-.14-.635.13-1.22.436-1.687.882-.445.47-.749 1.055-.878 1.688-.13.633-.08 1.29.144 1.896-.587.274-1.087.705-1.443 1.245-.356.54-.555 1.17-.574 1.817.02.647.218 1.276.574 1.817.356.54.856.972 1.443 1.245-.224.606-.274 1.263-.144 1.896.13.634.433 1.218.877 1.688.47.443 1.054.747 1.687.878.633.132 1.29.084 1.897-.136.274.586.705 1.084 1.246 1.439.54.354 1.17.551 1.816.569.647-.016 1.276-.213 1.817-.567s.972-.854 1.245-1.44c.604.239 1.266.296 1.903.164.636-.132 1.22-.447 1.68-.907.46-.46.776-1.044.908-1.681s.075-1.299-.165-1.903c.586-.274 1.084-.705 1.439-1.246.354-.54.551-1.17.569-1.816zM9.662 14.85l-3.429-3.428 1.293-1.302 2.072 2.072 4.4-4.794 1.347 1.246z"/></svg>';

    function escapeHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    window.toggleMenu = function(e) {
      e.stopPropagation();
      const menu = document.getElementById('menuDropdown');
      const overlay = document.getElementById('menuOverlay');
      if (menu.classList.contains('open')) { menu.classList.remove('open'); overlay.classList.remove('open'); }
      else { menu.classList.add('open'); overlay.classList.add('open'); }
    }
    window.closeMenu = function() { document.getElementById('menuDropdown').classList.remove('open'); document.getElementById('menuOverlay').classList.remove('open'); }

    // Live filter
    const LIVE_FILTER = '&or=(status.eq.live,status.is.null,release_at.lte.' + encodeURIComponent(new Date().toISOString()) + ')';

    function isRecentDate(dateStr) {
      if (!dateStr) return false;
      const d = new Date(dateStr);
      if (isNaN(d.getTime())) return false;
      const days = (Date.now() - d.getTime()) / (1000 * 60 * 60 * 24);
      return days >= 0 && days <= NEW_DAYS;
    }

    async function loadAlbums() {
      const container = document.getElementById('albumsList');
      const endMarker = document.getElementById('endMarker');
      try {
        const res = await fetch(SUPABASE_URL + '/rest/v1/songs?album_name=not.is.null&album_name=neq.&select=*' + LIVE_FILTER + '&order=id.desc', {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
        });
        const songs = await res.json();

        if (!Array.isArray(songs) || songs.length === 0) {
          container.innerHTML = '<div class="empty-state"><div class="icon">📀</div><h3>No albums yet.</h3></div>';
          return;
        }

        let verifiedArtists = {};
        try {
          const artistRes = await fetch(SUPABASE_URL + '/rest/v1/artists?select=name,verified', {
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
          });
          const artistData = await artistRes.json();
          if (Array.isArray(artistData)) {
            artistData.forEach(a => {
              if (a.verified && a.name) verifiedArtists[a.name.trim().toLowerCase()] = true;
            });
          }
        } catch (e) { console.warn('Artist fetch failed:', e); }

        const albumMap = {};
        songs.forEach(s => {
          const albumName = s.album_name.trim();
          if (!albumMap[albumName]) {
            albumMap[albumName] = {
              name: albumName,
              cover: s.cover,
              artist: (s.artist_name || 'Samarid').trim(),
              verified: false,
              category: s.category || 'Music',
              date: s.date || '',
              songCount: 0,
              totalPlays: 0
            };
          }
          albumMap[albumName].songCount++;
          albumMap[albumName].totalPlays += (s.plays || 0);
          if (s.verified) albumMap[albumName].verified = true;
        });

        Object.values(albumMap).forEach(album => {
          if (verifiedArtists[album.artist.toLowerCase()]) album.verified = true;
        });

        const albums = Object.values(albumMap);

        container.innerHTML = albums.map(album => {
          const badge = album.verified ? VERIFY_BADGE : '';
          const songLabel = album.songCount === 1 ? '1 song' : album.songCount + ' songs';
          const isNew = isRecentDate(album.date);
          const newBadge = isNew ? '<span class="album-new-badge">NEW</span>' : '';
          const linkUrl = 'album.html?name=' + encodeURIComponent(album.name);

          return `
            <a href="${linkUrl}" class="album-card">
              <div class="album-cover">
                ${newBadge}
                <img src="${escapeHtml(album.cover)}" alt="${escapeHtml(album.name)}" loading="lazy">
              </div>
              <div class="album-info">
                <div class="album-artist">${escapeHtml(album.artist)}${badge} <span class="dot">•</span> ${escapeHtml(album.category)}</div>
                <div class="album-name">${escapeHtml(album.name)}</div>
                <div class="album-date">${escapeHtml(album.date)}</div>
                <div class="album-songs"><i class="fas fa-music"></i> ${songLabel}</div>
              </div>
            </a>
          `;
        }).join('');

        endMarker.style.display = 'block';
      } catch (e) {
        console.error(e);
        container.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><h3>Could not load albums.</h3></div>';
      }
    }

    loadAlbums();
  </script>
</body>
</html>
