<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artists - Samarid Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { --bg: #ffffff; --text: #0a0a0a; --text2: #888888; --accent: #ff0033; --orange: #ff8800; --border: #eeeeee; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, Roboto, sans-serif; min-height: 100vh; padding-bottom: 40px; }

  /* HEADER */
  .header { position: sticky; top: 0; background: #111111; padding: 12px 16px; display: flex; align-items: center; gap: 10px; z-index: 100; }
  .back-btn { background: #222; color: #fff; border: none; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 6px; }
  .back-btn:active { background: var(--accent); }
  .logo { font-size: 18px; font-weight: 900; color: #fff; text-decoration: none; flex: 1; text-align: center; }
  .logo span { color: var(--accent); }

  /* PAGE HEADER */
  .page-header { max-width: 700px; margin: 0 auto; padding: 30px 16px 8px; }
  .page-title { font-size: 28px; font-weight: 900; letter-spacing: -0.8px; margin-bottom: 6px; color: var(--text); }
  .page-sub { font-size: 13px; color: var(--text2); line-height: 1.5; }

  /* SEARCH */
  .search-wrap { position: relative; max-width: 700px; margin: 20px auto 20px; padding: 0 16px; }
  .search-wrap i { position: absolute; left: 30px; top: 50%; transform: translateY(-50%); color: var(--text2); font-size: 13px; }
  .search-input { width: 100%; padding: 13px 14px 13px 42px; background: #f5f5f5; border: 1px solid var(--border); border-radius: 12px; color: var(--text); font-size: 14px; font-family: inherit; }
  .search-input:focus { outline: none; border-color: var(--orange); background: #fff; }
  .search-input::placeholder { color: var(--text2); }

  /* ARTIST GRID — 4 COLUMNS */
  .artist-grid {
    max-width: 700px;
    margin: 0 auto;
    padding: 0 16px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px 8px;
  }

  .artist-cell {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    text-decoration: none;
    color: inherit;
    text-align: center;
    transition: all 0.2s;
    padding: 6px 2px;
  }
  .artist-cell:active { transform: scale(0.92); }

  /* Avatar circle */
  .artist-avatar {
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(135deg, #ff8800 0%, #cc6600 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    font-weight: 900;
    font-size: 20px;
    letter-spacing: -0.5px;
    overflow: hidden;
    margin-bottom: 8px;
    box-shadow: 0 4px 12px rgba(255, 136, 0, 0.2);
    border: 2px solid #ffffff;
    position: relative;
  }
  .artist-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

  /* Tiny verified badge on avatar */
  .artist-avatar .badge-on-avatar {
    position: absolute;
    bottom: -2px;
    right: -2px;
    width: 18px;
    height: 18px;
    background: #ffffff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.15);
  }
  .artist-avatar .badge-on-avatar svg {
    width: 12px;
    height: 12px;
  }

  /* Name under avatar */
  .artist-name {
    font-size: 11px;
    font-weight: 700;
    color: var(--orange);
    line-height: 1.2;
    width: 100%;
    text-align: center;
    overflow: hidden;
    text-overflow: ellipsis;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    word-break: break-word;
  }

  .loading, .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text2);
    font-size: 14px;
    grid-column: 1 / -1;
  }
  .loading .icon, .empty .icon { font-size: 42px; margin-bottom: 12px; }
  .loading h3, .empty h3 { font-size: 16px; color: var(--text); margin-bottom: 6px; font-weight: 900; }

  .footer { padding: 30px 20px; text-align: center; font-size: 11px; color: var(--text2); border-top: 1px solid var(--border); margin-top: 40px; background: #fafafa; }
  .footer .brand { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>

  <header class="header">
    <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
    <a href="index.html" class="logo">SAMARID <span>MUSIC</span></a>
    <div style="width: 70px;"></div>
  </header>

  <div class="page-header">
    <h1 class="page-title">Artists</h1>
    <p class="page-sub">Every artist on Samarid Music — tap to open their profile.</p>
  </div>

  <div class="search-wrap">
    <i class="fas fa-search"></i>
    <input type="text" class="search-input" id="searchInput" placeholder="Search artist..." oninput="filterArtists()">
  </div>

  <div class="artist-grid" id="artistGrid">
    <div class="loading">
      <div class="icon">🎤</div>
      <h3>Loading artists...</h3>
    </div>
  </div>

  <footer class="footer"><span class="brand">SAMARID MUSIC</span> © 2026</footer>

  <script>
    const SUPABASE_URL = "https://kamnfnukaizdglntcdvi.supabase.co";
    const SUPABASE_KEY = "sb_publishable__YPveWCU1NMYYsegLLYskg_38s0VRip";

    const VERIFY_BADGE_SMALL = '<svg viewBox="0 0 22 22"><path fill="#1d9bf0" d="M20.396 11c-.018-.646-.215-1.275-.57-1.816-.354-.54-.852-.972-1.438-1.246.223-.607.27-1.264.14-1.897-.131-.634-.437-1.218-.882-1.687-.47-.445-1.053-.75-1.687-.882-.633-.13-1.29-.083-1.897.14-.273-.587-.704-1.086-1.245-1.44S11.647 1.62 11 1.604c-.646.017-1.273.213-1.813.568s-.969.854-1.24 1.44c-.608-.223-1.267-.272-1.902-.14-.635.13-1.22.436-1.687.882-.445.47-.749 1.055-.878 1.688-.13.633-.08 1.29.144 1.896-.587.274-1.087.705-1.443 1.245-.356.54-.555 1.17-.574 1.817.02.647.218 1.276.574 1.817.356.54.856.972 1.443 1.245-.224.606-.274 1.263-.144 1.896.13.634.433 1.218.877 1.688.47.443 1.054.747 1.687.878.633.132 1.29.084 1.897-.136.274.586.705 1.084 1.246 1.439.54.354 1.17.551 1.816.569.647-.016 1.276-.213 1.817-.567s.972-.854 1.245-1.44c.604.239 1.266.296 1.903.164.636-.132 1.22-.447 1.68-.907.46-.46.776-1.044.908-1.681s.075-1.299-.165-1.903c.586-.274 1.084-.705 1.439-1.246.354-.54.551-1.17.569-1.816zM9.662 14.85l-3.429-3.428 1.293-1.302 2.072 2.072 4.4-4.794 1.347 1.246z"/></svg>';

    let allArtists = [];

    async function loadArtists() {
      const container = document.getElementById('artistGrid');
      try {
        const [songsRes, profilesRes] = await Promise.all([
          fetch(SUPABASE_URL + '/rest/v1/songs?select=artist_name,verified', {
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
          }),
          fetch(SUPABASE_URL + '/rest/v1/artists?select=name,profile_pic,verified', {
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
          })
        ]);

        const songs = await songsRes.json();
        let profiles = await profilesRes.json();
        if (!Array.isArray(profiles)) profiles = [];

        const profileMap = {};
        profiles.forEach(p => {
          if (p.name) profileMap[p.name.trim().toLowerCase()] = p;
        });

        const artistMap = {};

        (Array.isArray(songs) ? songs : []).forEach(s => {
          const name = (s.artist_name || 'Samarid').trim();
          const key = name.toLowerCase();
          if (!artistMap[key]) artistMap[key] = { name: name, verified: false, profile_pic: null };
          if (s.verified) artistMap[key].verified = true;
        });

        profiles.forEach(p => {
          if (!p.name) return;
          const key = p.name.trim().toLowerCase();
          if (!artistMap[key]) artistMap[key] = { name: p.name, verified: false, profile_pic: null };
          if (p.verified) artistMap[key].verified = true;
          if (p.profile_pic) artistMap[key].profile_pic = p.profile_pic;
        });

        allArtists = Object.values(artistMap).sort((a, b) =>
          a.name.toLowerCase().localeCompare(b.name.toLowerCase())
        );

        renderArtists(allArtists);
      } catch (e) {
        console.error(e);
        container.innerHTML = '<div class="empty"><div class="icon">⚠️</div><h3>Could not load artists</h3></div>';
      }
    }

    function renderArtists(list) {
      const container = document.getElementById('artistGrid');

      if (list.length === 0) {
        container.innerHTML = '<div class="empty"><div class="icon">🔍</div><h3>No artists found</h3></div>';
        return;
      }

      container.innerHTML = list.map(a => {
        const url = 'artist-template.html?name=' + encodeURIComponent(a.name);
        const avatarHTML = a.profile_pic
          ? '<img src="' + a.profile_pic + '" alt="' + a.name + '">'
          : a.name.charAt(0).toUpperCase();
        const badgeHTML = a.verified
          ? '<div class="badge-on-avatar">' + VERIFY_BADGE_SMALL + '</div>'
          : '';

        return `
          <a href="${url}" class="artist-cell">
            <div class="artist-avatar">
              ${avatarHTML}
              ${badgeHTML}
            </div>
            <div class="artist-name">${a.name}</div>
          </a>
        `;
      }).join('');
    }

    window.filterArtists = function() {
      const query = document.getElementById('searchInput').value.trim().toLowerCase();
      if (!query) { renderArtists(allArtists); return; }
      const filtered = allArtists.filter(a => a.name.toLowerCase().includes(query));
      renderArtists(filtered);
    }

    loadArtists();
  </script>
</body>
</html>
