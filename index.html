<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Samarid Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --card: #141414;
    --border: #222;
    --text: #ffffff;
    --text2: #cccccc;
    --accent: #ff0033;
  }

  body.light {
    --bg: #ffffff;
    --card: #f5f5f5;
    --border: #e5e5e5;
    --text: #0a0a0a;
    --text2: #444444;
  }

  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Inter', -apple-system, Roboto, sans-serif;
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
    padding-bottom: 40px;
  }

  /* ===== HEADER ===== */
  .header {
    position: sticky;
    top: 0;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
    padding: 12px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 100;
    transition: background 0.3s;
  }

  .menu-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: var(--text);
    font-size: 18px;
    font-weight: 700;
    transition: all 0.15s;
  }
  .menu-btn:active {
    background: var(--accent);
    color: #fff;
  }

  .logo {
    font-size: 18px;
    font-weight: 900;
    letter-spacing: -0.5px;
    color: var(--text);
    text-decoration: none;
    flex: 1;
    text-align: center;
  }
  .logo span { color: var(--accent); }

  .subscribe-btn {
    background: var(--accent);
    color: #ffffff;
    border: none;
    padding: 8px 16px;
    border-radius: 18px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.5px;
    text-decoration: none;
    cursor: pointer;
    transition: opacity 0.15s;
  }
  .subscribe-btn:active { opacity: 0.8; }

  /* ===== DROPDOWN MENU ===== */
  .menu-dropdown {
    position: fixed;
    top: 58px;
    left: 12px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    min-width: 280px;
    max-width: 340px;
    overflow: hidden;
    display: none;
    z-index: 200;
  }
  .menu-dropdown.open { display: block; }

  .menu-title {
    padding: 12px 18px 8px;
    font-size: 10px;
    color: var(--text2);
    letter-spacing: 2px;
    font-weight: 700;
    text-transform: uppercase;
    border-bottom: 1px solid var(--border);
  }

  .menu-item {
    padding: 13px 18px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 12px;
    text-decoration: none;
    border-bottom: 1px solid var(--border);
    transition: background 0.15s;
  }
  .menu-item:last-child { border-bottom: none; }
  .menu-item:active { background: var(--border); }
  .menu-item .icon { font-size: 16px; width: 20px; text-align: center; }
  .menu-item .label { flex: 1; color: var(--text); }
  .menu-item .arrow { color: var(--text2); font-size: 11px; }

  /* COLOR PICKER */
  .color-picker {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .color-picker-title {
    font-size: 10px;
    color: var(--text2);
    letter-spacing: 2px;
    font-weight: 700;
    margin-bottom: 10px;
    text-transform: uppercase;
  }
  .color-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }
  .color-circle {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.15s, border-color 0.15s;
  }
  .color-circle.active {
    border-color: var(--text);
    transform: scale(1.15);
  }

  /* THEME SWITCH */
  .theme-row {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .theme-label {
    font-size: 13px;
    color: var(--text);
  }
  .theme-toggle {
    display: flex;
    gap: 6px;
  }
  .theme-btn {
    padding: 6px 12px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--text);
    font-size: 11px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .theme-btn.active {
    border-color: var(--accent);
    color: var(--accent);
    font-weight: 700;
  }

  /* ===== VIDEO GRID ===== */
  .section {
    padding: 20px 16px 30px;
  }
  .section-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 16px;
    padding-bottom: 10px;
    border-bottom: 1px solid var(--border);
  }

  .video-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 24px;
  }
  @media (min-width: 600px) {
    .video-grid { grid-template-columns: 1fr 1fr; }
  }
  @media (min-width: 900px) {
    .video-grid { grid-template-columns: 1fr 1fr 1fr; }
  }

  .video-card {
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    display: block;
    transition: transform 0.15s;
  }
  .video-card:active { transform: scale(0.98); }

  .video-thumb {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 12px;
    border: 1px solid var(--border);
  }
  .video-thumb img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* YouTube-style play button overlay */
  .video-play-overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    background: rgba(0,0,0,0.12);
  }
  .video-play-overlay::after {
    content: '';
    width: 56px;
    height: 40px;
    background: rgba(0,0,0,0.75);
    border-radius: 6px;
    position: relative;
  }
  .video-play-overlay::before {
    content: '';
    position: absolute;
    width: 0;
    height: 0;
    border-left: 14px solid #ffffff;
    border-top: 9px solid transparent;
    border-bottom: 9px solid transparent;
    margin-left: 3px;
    z-index: 2;
  }

  .video-title {
    font-size: 15px;
    font-weight: 600;
    line-height: 1.35;
    margin-bottom: 6px;
    color: var(--text);
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .video-meta {
    font-size: 12px;
    color: var(--text2);
  }

  .loading, .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--text2);
    font-size: 13px;
  }

  /* ===== VIDEO PLAYER MODAL ===== */
  .player-modal {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.95);
    z-index: 1000;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .player-modal.open { display: flex; }

  .player-inner {
    width: 100%;
    max-width: 900px;
    background: #000;
    border-radius: 12px;
    overflow: hidden;
    position: relative;
  }
  .player-video {
    width: 100%;
    aspect-ratio: 16 / 9;
    border: none;
    display: block;
  }
  .player-close {
    position: absolute;
    top: -50px;
    right: 0;
    background: rgba(255,255,255,0.15);
    color: #fff;
    border: none;
    width: 40px;
    height: 40px;
    border-radius: 50%;
    font-size: 22px;
    cursor: pointer;
    font-weight: 700;
  }
  .player-close:active { background: var(--accent); }

  /* ===== FOOTER ===== */
  .footer {
    padding: 30px 20px;
    text-align: center;
    font-size: 11px;
    color: var(--text2);
    letter-spacing: 1px;
    border-top: 1px solid var(--border);
    margin-top: 20px;
  }
  .footer .brand { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <button class="menu-btn" onclick="toggleMenu(event)">⋮</button>
    <a href="#" class="logo">SAMARID <span>MUSIC</span></a>
    <a href="https://youtube.com/@realsamarid?sub_confirmation=1" target="_blank" class="subscribe-btn">SUBSCRIBE</a>
  </header>

  <!-- DROPDOWN MENU -->
  <div class="menu-dropdown" id="menuDropdown" onclick="event.stopPropagation()">

    <div class="menu-title">⚙️ Settings</div>

    <div class="theme-row">
      <span class="theme-label">Theme</span>
      <div class="theme-toggle">
        <button class="theme-btn" data-theme="dark" onclick="setTheme('dark')">Dark</button>
        <button class="theme-btn" data-theme="light" onclick="setTheme('light')">Light</button>
      </div>
    </div>

    <div class="color-picker">
      <div class="color-picker-title">Accent Color</div>
      <div class="color-row">
        <div class="color-circle" style="background:#ff0033;" data-color="#ff0033" onclick="setAccent('#ff0033')"></div>
        <div class="color-circle" style="background:#ff6b00;" data-color="#ff6b00" onclick="setAccent('#ff6b00')"></div>
        <div class="color-circle" style="background:#ffcc00;" data-color="#ffcc00" onclick="setAccent('#ffcc00')"></div>
        <div class="color-circle" style="background:#00cc44;" data-color="#00cc44" onclick="setAccent('#00cc44')"></div>
        <div class="color-circle" style="background:#0084ff;" data-color="#0084ff" onclick="setAccent('#0084ff')"></div>
        <div class="color-circle" style="background:#8a2be2;" data-color="#8a2be2" onclick="setAccent('#8a2be2')"></div>
        <div class="color-circle" style="background:#ff00e0;" data-color="#ff00e0" onclick="setAccent('#ff00e0')"></div>
        <div class="color-circle" style="background:#00c7be;" data-color="#00c7be" onclick="setAccent('#00c7be')"></div>
      </div>
    </div>

    <div class="menu-title">🔗 Follow</div>

    <a href="https://youtube.com/@realsamarid" target="_blank" class="menu-item">
      <span class="icon">▶️</span>
      <span class="label">YouTube</span>
      <span class="arrow">↗</span>
    </a>
    <a href="https://tiktok.com/@realsamarid" target="_blank" class="menu-item">
      <span class="icon">🎵</span>
      <span class="label">TikTok</span>
      <span class="arrow">↗</span>
    </a>
    <a href="https://instagram.com/realsamarid" target="_blank" class="menu-item">
      <span class="icon">📸</span>
      <span class="label">Instagram</span>
      <span class="arrow">↗</span>
    </a>
    <a href="mailto:contact@samarid.com" class="menu-item">
      <span class="icon">✉️</span>
      <span class="label">Contact</span>
      <span class="arrow">↗</span>
    </a>

    <div class="menu-title">ℹ️ Info</div>
    <div class="menu-item" onclick="showAbout()">
      <span class="icon">🎤</span>
      <span class="label">About Samarid</span>
      <span class="arrow">›</span>
    </div>
  </div>

  <!-- VIDEOS -->
  <section class="section">
    <div class="section-title">Latest Releases</div>
    <div class="video-grid" id="videoGrid">
      <div class="loading">Loading videos...</div>
    </div>
  </section>

  <!-- VIDEO PLAYER MODAL -->
  <div class="player-modal" id="playerModal" onclick="closePlayer()">
    <div class="player-inner" onclick="event.stopPropagation()">
      <button class="player-close" onclick="closePlayer()">✕</button>
      <iframe class="player-video" id="playerFrame" allow="autoplay; encrypted-media" allowfullscreen></iframe>
    </div>
  </div>

  <!-- FOOTER -->
  <footer class="footer">
    <span class="brand">SAMARID MUSIC</span> © 2026
  </footer>

  <script>
    // === MENU ===
    function toggleMenu(e) {
      e.stopPropagation();
      document.getElementById('menuDropdown').classList.toggle('open');
    }
    function closeMenu() {
      document.getElementById('menuDropdown').classList.remove('open');
    }
    document.addEventListener('click', closeMenu);

    function showAbout() {
      alert('Samarid Music\n\nArtist · Creating music that moves you.\n\nSubscribe on YouTube: @realsamarid');
      closeMenu();
    }

    // === THEME ===
    function applySettings() {
      const theme = localStorage.getItem('samarid-theme') || 'dark';
      const accent = localStorage.getItem('samarid-accent') || '#ff0033';

      document.body.classList.toggle('light', theme === 'light');
      document.documentElement.style.setProperty('--accent', accent);

      document.querySelectorAll('.theme-btn').forEach(b => {
        b.classList.toggle('active', b.dataset.theme === theme);
      });
      document.querySelectorAll('.color-circle').forEach(c => {
        c.classList.toggle('active', c.dataset.color === accent);
      });
    }

    function setTheme(theme) {
      localStorage.setItem('samarid-theme', theme);
      applySettings();
    }

    function setAccent(color) {
      localStorage.setItem('samarid-accent', color);
      applySettings();
    }

    // === VIDEO PLAYER ===
    function openPlayer(videoId) {
      const modal = document.getElementById('playerModal');
      const frame = document.getElementById('playerFrame');
      frame.src = 'https://www.youtube.com/embed/' + videoId + '?autoplay=1&rel=0';
      modal.classList.add('open');
    }
    function closePlayer() {
      const modal = document.getElementById('playerModal');
      const frame = document.getElementById('playerFrame');
      frame.src = '';
      modal.classList.remove('open');
    }

    // === YOUTUBE AUTO-SYNC ===
    const CHANNEL_ID = 'UC11ElndF459dLRfV-OzwmpA';

    async function loadVideos() {
      const grid = document.getElementById('videoGrid');
      const rssUrl = 'https://www.youtube.com/feeds/videos.xml?channel_id=' + CHANNEL_ID;
      const apiUrl = 'https://api.rss2json.com/v1/api.json?rss_url=' + encodeURIComponent(rssUrl);

      try {
        const res = await fetch(apiUrl);
        const data = await res.json();

        if (!data.items || data.items.length === 0) {
          grid.innerHTML = '<div class="empty">No videos yet — check back soon! 🎵</div>';
          return;
        }

        grid.innerHTML = data.items.map(item => {
          const videoId = item.link.split('v=')[1] || item.guid.split(':')[2];
          const thumb = 'https://i.ytimg.com/vi/' + videoId + '/hqdefault.jpg';
          const title = item.title;
          const date = new Date(item.pubDate).toLocaleDateString('en-US', {
            month: 'short', day: 'numeric', year: 'numeric'
          });
          return `
            <div class="video-card" onclick="openPlayer('${videoId}')">
              <div class="video-thumb">
                <img src="${thumb}" alt="${title}" loading="lazy">
                <div class="video-play-overlay"></div>
              </div>
              <div class="video-title">${title}</div>
              <div class="video-meta">${date}</div>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error(err);
        grid.innerHTML = '<div class="empty">Could not load videos. Visit YouTube →</div>';
      }
    }

    applySettings();
    loadVideos();
  </script>
</body>
</html>
