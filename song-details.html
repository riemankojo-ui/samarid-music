<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Song - Samarid Music</title>
<meta name="description" content="Listen to this track on Samarid Music — like, comment, and vote.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { --bg: #0a0a0a; --card: #141414; --border: #222; --text: #ffffff; --text2: #cccccc; --accent: #ff0033; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; min-width: 0; }
  html, body { overflow-x: hidden; max-width: 100vw; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; padding-bottom: 40px; overflow-x: hidden; }
  img { max-width: 100%; }

  .header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--border); padding: 12px; display: flex; align-items: center; gap: 8px; z-index: 100; }
  .menu-btn { width: 42px; height: 42px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; cursor: pointer; flex-shrink: 0; padding: 0; }
  .menu-btn span { display: block; width: 20px; height: 2px; background: var(--text); border-radius: 2px; transition: all 0.2s; }
  .menu-btn:active { background: var(--accent); border-color: var(--accent); }
  .menu-btn:active span { background: #fff; }
  .logo { font-size: 16px; font-weight: 900; color: var(--text); text-decoration: none; flex: 1; text-align: center; white-space: nowrap; min-width: 0; }
  .logo span { color: var(--accent); }
  .user-badge { display: flex; align-items: center; gap: 5px; background: var(--card); border: 1px solid var(--border); padding: 8px 10px; border-radius: 20px; font-size: 11px; font-weight: 700; color: var(--text2); cursor: pointer; flex-shrink: 0; max-width: 90px; overflow: hidden; height: 42px; }
  .user-badge span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .user-badge i { color: var(--accent); flex-shrink: 0; }

  .menu-dropdown { position: fixed; top: 66px; left: 12px; background: #141414; border: 1px solid #2a2a2a; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.7); width: 250px; max-width: calc(100vw - 24px); max-height: 70vh; overflow-y: auto; display: none; z-index: 9999; }
  .menu-dropdown.open { display: block; animation: menuPop 0.2s ease; }
  @keyframes menuPop { from { opacity: 0; transform: translateY(-8px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .menu-title { padding: 14px 18px 8px; font-size: 10px; color: #666; letter-spacing: 2px; font-weight: 700; text-transform: uppercase; }
  .menu-item { padding: 13px 18px; font-size: 14px; color: #fff; cursor: pointer; display: flex; align-items: center; gap: 12px; text-decoration: none; transition: background 0.15s; background: transparent; border: none; width: 100%; font-family: inherit; text-align: left; }
  .menu-item:active { background: #1f1f1f; }
  .menu-item i { width: 20px; text-align: center; font-size: 15px; color: var(--accent); flex-shrink: 0; }
  .menu-item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu-divider { height: 1px; background: #222; margin: 4px 0; }
  .menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9998; display: none; }
  .menu-overlay.open { display: block; }

  /* HEADER TABS */
  .mini-tabs-wrapper { position: sticky; top: 66px; z-index: 90; background: var(--bg); border-bottom: 1px solid var(--border); }
  .mini-tabs { display: flex; justify-content: center; gap: 8px; padding: 16px 16px 0; max-width: 700px; margin: 0 auto; position: relative; }
  .mini-tab { padding: 10px 20px; background: transparent; border: none; color: var(--text2); font-weight: 700; font-size: 14px; cursor: pointer; font-family: inherit; transition: color 0.25s ease; position: relative; z-index: 2; }
  .mini-tab.active { color: var(--accent); }
  .mini-tabs-underline { position: absolute; bottom: 0; height: 3px; background: var(--accent); border-radius: 3px; transition: left 0.3s cubic-bezier(0.4, 0, 0.2, 1), width 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1; }

  .slides-viewport { overflow: hidden; touch-action: pan-y; }
  .slides-track { display: flex; transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1); will-change: transform; }
  .slide-page { flex: 0 0 100%; width: 100%; min-width: 0; }

  .container { max-width: 700px; margin: 0 auto; padding: 20px 16px; }

  /* SONG HERO */
  .song-hero { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 24px 20px; text-align: center; margin-bottom: 12px; }
  .song-cover { width: 220px; max-width: 100%; height: 220px; border-radius: 12px; overflow: hidden; margin: 0 auto 20px; box-shadow: 0 15px 40px rgba(0,0,0,0.5); background: #000; }
  .song-cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .song-title { font-size: 26px; font-weight: 900; margin-bottom: 16px; letter-spacing: -0.6px; overflow-wrap: anywhere; word-break: break-word; max-width: 100%; }

  /* TikTok-style artist chip */
  .artist-chip {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: #0f0f0f;
    border: 1px solid #1e1e1e;
    border-radius: 30px;
    padding: 5px 16px 5px 5px;
    margin: 0 auto 12px;
    cursor: pointer;
    transition: background 0.15s;
    max-width: 100%;
  }
  .artist-chip:active { background: #1a1a1a; transform: scale(0.98); }
  .artist-chip-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    overflow: hidden;
    flex-shrink: 0;
    background: linear-gradient(135deg, #ff0033, #b3002d);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 12px;
    font-weight: 900;
    color: #fff;
    border: 2px solid #ff0033;
  }
  .artist-chip-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .artist-chip-name {
    font-size: 15px;
    font-weight: 900;
    color: #fff;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 180px;
    letter-spacing: -0.2px;
  }

  .song-meta { font-size: 13px; color: var(--text2); margin-bottom: 20px; overflow-wrap: anywhere; word-break: break-word; }

  /* Small action pills */
  .action-row { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  .action-btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 22px;
    background: #0f0f0f;
    border: 1px solid #1e1e1e;
    border-radius: 30px;
    color: var(--text2);
    font-size: 14px;
    font-weight: 800;
    cursor: pointer;
    font-family: inherit;
    transition: 0.15s;
    min-width: 90px;
    justify-content: center;
  }
  .action-btn:active { transform: scale(0.94); }
  .action-btn i { font-size: 15px; }
  .action-btn.liked { background: var(--accent); color: #fff; border-color: var(--accent); }
  .action-btn.liked i { color: #fff; }
  .action-btn.plays-btn { color: #ff8800; cursor: default; background: #0f0f0f; }
  .action-btn.plays-btn i { color: #ff8800; }

  /* DETAIL SECTIONS */
  .detail-section { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 12px; }
  .detail-section h4 { font-size: 12px; color: var(--text2); letter-spacing: 2px; text-transform: uppercase; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }
  .detail-section p { font-size: 13px; line-height: 1.6; color: var(--text); overflow-wrap: anywhere; word-break: break-word; }

  /* COMMENTS */
  .comments-box { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 18px; margin-bottom: 12px; }
  .comments-list { max-height: 400px; overflow-y: auto; margin-bottom: 14px; }
  .comments-list::-webkit-scrollbar { width: 4px; }
  .comments-list::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
  .comment-item { padding: 12px 0; border-bottom: 1px solid var(--border); }
  .comment-item:last-child { border-bottom: none; }
  .comment-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; min-width: 0; }
  .comment-avatar { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #ff0033, #b3002d); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 900; flex-shrink: 0; }
  .comment-name { font-size: 12px; font-weight: 800; color: var(--accent); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .comment-text { font-size: 13px; color: #ddd; line-height: 1.5; overflow-wrap: anywhere; word-break: break-word; padding-left: 36px; max-width: 100%; }
  .comments-empty { text-align: center; padding: 20px; color: var(--text2); font-size: 13px; }

  .comment-form { display: flex; gap: 8px; }
  .comment-form input { flex: 1; padding: 12px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-size: 13px; font-family: inherit; min-width: 0; }
  .comment-form input:focus { outline: none; border-color: var(--accent); }
  .comment-form button { background: var(--accent); color: #fff; border: none; padding: 12px 18px; border-radius: 10px; cursor: pointer; font-weight: 900; font-family: inherit; font-size: 14px; flex-shrink: 0; }
  .comment-form button:active { transform: scale(0.96); }

  /* POLL */
  .poll-boxes { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  .poll-box { background: var(--card); border: 2px solid var(--border); border-radius: 14px; padding: 20px 10px; text-align: center; cursor: pointer; transition: 0.2s; min-width: 0; overflow: hidden; }
  .poll-box:active { transform: scale(0.96); }
  .poll-box.selected { background: var(--accent); border-color: var(--accent); color: #fff; }
  .poll-box .emoji { font-size: 28px; margin-bottom: 8px; display: block; }
  .poll-box .poll-label { font-size: 11px; font-weight: 700; line-height: 1.3; overflow-wrap: anywhere; word-break: break-word; }
  .poll-box .poll-votes { font-size: 10px; color: var(--text2); margin-top: 6px; display: block; font-weight: 500; }
  .poll-box.selected .poll-votes { color: rgba(255,255,255,0.8); }

  /* SPOTIFY */
  .page-title { font-size: 15px; font-weight: 900; text-align: center; padding: 14px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 16px; overflow-wrap: anywhere; word-break: break-word; }
  .spotify-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 40px 20px; text-align: center; }
  .spotify-card i { font-size: 50px; color: #1DB954; margin-bottom: 15px; }
  .spotify-card h3 { font-size: 18px; font-weight: 800; margin-bottom: 10px; overflow-wrap: anywhere; }
  .spotify-card p { font-size: 13px; color: var(--text2); margin-bottom: 20px; overflow-wrap: anywhere; }
  .spotify-play-btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    padding: 14px 28px;
    background: #1DB954;
    color: #fff;
    border-radius: 30px;
    font-size: 14px;
    font-weight: 900;
    text-decoration: none;
    box-shadow: 0 8px 24px rgba(29, 185, 84, 0.35);
    transition: transform 0.15s;
    letter-spacing: 0.3px;
  }
  .spotify-play-btn:active { transform: scale(0.95); }
  .spotify-play-btn i { font-size: 18px; color: #fff; margin: 0; }

  .verify-badge { display: inline-block; width: 14px; height: 14px; vertical-align: middle; flex-shrink: 0; }

  .footer { padding: 30px 20px; text-align: center; font-size: 11px; color: var(--text2); border-top: 1px solid var(--border); margin-top: 40px; }
  .footer .brand { color: var(--accent); font-weight: 700; }
  .loading { text-align: center; padding: 40px; color: var(--text2); font-size: 13px; }
</style>
</head>
<body>

  <header class="header">
    <button class="menu-btn" onclick="toggleMenu(event)" aria-label="Menu">
      <span></span>
      <span></span>
    </button>
    <a href="index.html" class="logo">SAMARID <span>MUSIC</span></a>
    <div class="user-badge"><i class="fas fa-user"></i> <span id="headerName">Fan</span></div>
  </header>

  <div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>
  <div class="menu-dropdown" id="menuDropdown" onclick="event.stopPropagation()">
    <div class="menu-title">Navigation</div>
    <a href="index.html" class="menu-item"><i class="fas fa-music"></i><span class="label">Music</span></a>
    <a href="albums.html" class="menu-item"><i class="fas fa-compact-disc"></i><span class="label">Albums</span></a>
    <a href="artists.html" class="menu-item"><i class="fas fa-user-group"></i><span class="label">Artists</span></a>
    <a href="videos.html" class="menu-item"><i class="fas fa-video"></i><span class="label">Videos</span></a>
    <a href="fanbase.html" class="menu-item"><i class="fas fa-heart"></i><span class="label">Fanbase</span></a>
    <div class="menu-divider"></div>
    <div class="menu-title">More</div>
    <a href="about.html" class="menu-item"><i class="fas fa-info-circle"></i><span class="label">About</span></a>
    <a href="promo.html" class="menu-item"><i class="fas fa-bullhorn"></i><span class="label">Promo</span></a>
    <a href="distributors.html" class="menu-item"><i class="fas fa-headphones"></i><span class="label">Get On Spotify</span></a>
  </div>

  <div class="mini-tabs-wrapper">
    <div class="mini-tabs" id="miniTabs">
      <button class="mini-tab active" id="tabSongs" onclick="switchMini(0, this)">Songs</button>
      <button class="mini-tab" id="tabPoll" onclick="switchMini(1, this)">Poll</button>
      <button class="mini-tab" id="tabSpotify" onclick="switchMini(2, this)">Spotify</button>
      <div class="mini-tabs-underline" id="tabsUnderline"></div>
    </div>
  </div>

  <div class="slides-viewport" id="slidesViewport">
    <div class="slides-track" id="slidesTrack">

      <!-- PAGE 1: SONG DETAIL -->
      <div class="slide-page">
        <div class="container" id="songContent">
          <div class="loading">Loading song...</div>
        </div>
      </div>

      <!-- PAGE 2: POLL -->
      <div class="slide-page">
        <div class="container">
          <div class="page-title" id="pollTitle">💬 How Do You Like This Artist?</div>
          <div class="poll-boxes">
            <div class="poll-box" id="poll-love" onclick="vote('love')">
              <span class="emoji">❤️</span>
              <span class="poll-label">Love this artist</span>
              <span class="poll-votes" id="votes-love">0</span>
            </div>
            <div class="poll-box" id="poll-sometimes" onclick="vote('sometimes')">
              <span class="emoji">⏰</span>
              <span class="poll-label">Sometimes</span>
              <span class="poll-votes" id="votes-sometimes">0</span>
            </div>
            <div class="poll-box" id="poll-one" onclick="vote('one')">
              <span class="emoji">🎵</span>
              <span class="poll-label">One song only</span>
              <span class="poll-votes" id="votes-one">0</span>
            </div>
          </div>
          <p id="pollStatus" style="text-align:center; font-size:12px; color:#00cc44; margin-top:20px; font-weight:700;"></p>
        </div>
      </div>

      <!-- PAGE 3: SPOTIFY (now dynamic per song) -->
      <div class="slide-page">
        <div class="container">
          <div class="page-title">🎧 Listen on Spotify</div>
          <div class="spotify-card" id="spotifyCard">
            <i class="fab fa-spotify"></i>
            <h3 id="spotifyHeading">Loading...</h3>
            <p id="spotifyText">Checking Spotify...</p>
          </div>
        </div>
      </div>

    </div>
  </div>

  <footer class="footer"><span class="brand">SAMARID MUSIC</span> © 2026</footer>

  <script>
    const SUPABASE_URL = "https://kamnfnukaizdglntcdvi.supabase.co";
    const SUPABASE_KEY = "sb_publishable__YPveWCU1NMYYsegLLYskg_38s0VRip";

    const VERIFY_BADGE = '<svg class="verify-badge" viewBox="0 0 22 22"><path fill="#1d9bf0" d="M20.396 11c-.018-.646-.215-1.275-.57-1.816-.354-.54-.852-.972-1.438-1.246.223-.607.27-1.264.14-1.897-.131-.634-.437-1.218-.882-1.687-.47-.445-1.053-.75-1.687-.882-.633-.13-1.29-.083-1.897.14-.273-.587-.704-1.086-1.245-1.44S11.647 1.62 11 1.604c-.646.017-1.273.213-1.813.568s-.969.854-1.24 1.44c-.608-.223-1.267-.272-1.902-.14-.635.13-1.22.436-1.687.882-.445.47-.749 1.055-.878 1.688-.13.633-.08 1.29.144 1.896-.587.274-1.087.705-1.443 1.245-.356.54-.555 1.17-.574 1.817.02.647.218 1.276.574 1.817.356.54.856.972 1.443 1.245-.224.606-.274 1.263-.144 1.896.13.634.433 1.218.877 1.688.47.443 1.054.747 1.687.878.633.132 1.29.084 1.897-.136.274.586.705 1.084 1.246 1.439.54.354 1.17.551 1.816.569.647-.016 1.276-.213 1.817-.567s.972-.854 1.245-1.44c.604.239 1.266.296 1.903.164.636-.132 1.22-.447 1.68-.907.46-.46.776-1.044.908-1.681s.075-1.299-.165-1.903c.586-.274 1.084-.705 1.439-1.246.354-.54.551-1.17.569-1.816zM9.662 14.85l-3.429-3.428 1.293-1.302 2.072 2.072 4.4-4.794 1.347 1.246z"/></svg>';

    function escapeHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function safeUrl(u) {
      if (!u) return '';
      const s = String(u).trim();
      if (/^https?:\/\//i.test(s)) return s;
      return '';
    }

    let visitorId = localStorage.getItem('samarid_visitor_id');
    if (!visitorId) {
      visitorId = 'v_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);
      localStorage.setItem('samarid_visitor_id', visitorId);
    }

    let fanName = localStorage.getItem('samarid_fan_name') || 'Anonymous Fan';
    let fanFirstName = localStorage.getItem('samarid_fan_first_name') || 'Fan';
    let currentSong = null;
    let currentArtistName = '';
    let currentPage = 0;
    let myLikes = JSON.parse(localStorage.getItem('samarid_my_likes') || '[]');
    function saveMyLikes() { localStorage.setItem('samarid_my_likes', JSON.stringify(myLikes)); }

    document.getElementById('headerName').innerText = fanFirstName;

    const slidesTrack = document.getElementById('slidesTrack');
    const slidesViewport = document.getElementById('slidesViewport');
    const miniTabs = document.getElementById('miniTabs');

    // ===== MENU =====
    window.toggleMenu = function(e) {
      e.stopPropagation();
      const menu = document.getElementById('menuDropdown');
      const overlay = document.getElementById('menuOverlay');
      if (menu.classList.contains('open')) {
        menu.classList.remove('open');
        overlay.classList.remove('open');
      } else {
        menu.classList.add('open');
        overlay.classList.add('open');
      }
    }
    window.closeMenu = function() {
      document.getElementById('menuDropdown').classList.remove('open');
      document.getElementById('menuOverlay').classList.remove('open');
    }

    // ===== TABS =====
    window.switchMini = function(pageIndex, btn) {
      goToPage(pageIndex);
      document.querySelectorAll('.mini-tab').forEach(t => t.classList.remove('active'));
      if (btn) btn.classList.add('active');
      moveUnderline(btn || document.querySelectorAll('.mini-tab')[pageIndex]);
    }

    function goToPage(index) {
      currentPage = index;
      slidesTrack.style.transform = 'translateX(-' + (index * 100) + '%)';
      document.querySelectorAll('.mini-tab').forEach((t, i) => {
        if (i === index) t.classList.add('active');
        else t.classList.remove('active');
      });
      moveUnderline(document.querySelectorAll('.mini-tab')[index]);
    }

    function moveUnderline(btn) {
      if (!btn) return;
      const underline = document.getElementById('tabsUnderline');
      const tabsRect = miniTabs.getBoundingClientRect();
      const btnRect = btn.getBoundingClientRect();
      underline.style.left = (btnRect.left - tabsRect.left) + 'px';
      underline.style.width = btnRect.width + 'px';
    }

    window.addEventListener('load', () => setTimeout(() => moveUnderline(document.querySelector('.mini-tab.active')), 100));
    window.addEventListener('resize', () => moveUnderline(document.querySelector('.mini-tab.active')));

    let touchStartX = 0, touchStartY = 0;
    slidesViewport.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
      touchStartY = e.changedTouches[0].screenY;
    }, { passive: true });
    slidesViewport.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].screenX - touchStartX;
      const dy = e.changedTouches[0].screenY - touchStartY;
      if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) {
        if (dx < 0 && currentPage < 2) goToPage(currentPage + 1);
        else if (dx > 0 && currentPage > 0) goToPage(currentPage - 1);
      }
    }, { passive: true });

    // ===== LOAD SONG =====
    async function loadSong() {
      const params = new URLSearchParams(window.location.search);
      let songId = params.get('id');
      const container = document.getElementById('songContent');

      if (!songId) {
        try {
          const fallbackRes = await fetch(SUPABASE_URL + '/rest/v1/songs?select=id&order=id.desc&limit=1', {
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
          });
          const fallbackData = await fallbackRes.json();
          if (Array.isArray(fallbackData) && fallbackData.length > 0) {
            songId = fallbackData[0].id;
            window.history.replaceState({}, '', '?id=' + songId);
          } else {
            container.innerHTML = '<div class="loading">No songs yet.</div>';
            return;
          }
        } catch (e) {
          container.innerHTML = '<div class="loading">Connection error.</div>';
          return;
        }
      }

      try {
        const res = await fetch(SUPABASE_URL + '/rest/v1/songs?id=eq.' + songId, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
        });
        const data = await res.json();

        if (!data || data.length === 0) {
          container.innerHTML = '<div class="loading">Song not found.</div>';
          return;
        }

        const s = data[0];
        currentSong = s;
        const artist = s.artist_name || 'Samarid';
        currentArtistName = artist;
        const badge = s.verified ? VERIFY_BADGE : '';
        document.title = s.title + ' - ' + artist + ' - Samarid Music';

        container.innerHTML = `
          <div class="song-hero">
            <div class="song-cover"><img src="${escapeHtml(s.cover)}" alt="${escapeHtml(s.title)}"></div>
            <h1 class="song-title">${escapeHtml(s.title)}</h1>

            <div class="artist-chip" onclick="goToArtist()">
              <div class="artist-chip-avatar" id="chipAvatar">${escapeHtml(artist.charAt(0).toUpperCase())}</div>
              <span class="artist-chip-name">${escapeHtml(artist)}${badge}</span>
            </div>

            <p class="song-meta">${escapeHtml(s.category || 'Music')} • ${escapeHtml(s.date || '')}</p>

            <div class="action-row">
              <button class="action-btn" id="likeBtn" onclick="toggleLike(${s.id}, this)">
                <i class="fas fa-heart"></i> <span id="likeCount">0</span>
              </button>
              <div class="action-btn plays-btn">
                <i class="fas fa-fire"></i> <span id="playsCount">${s.plays || 0}</span>
              </div>
            </div>
          </div>

          <div class="detail-section">
            <h4>📖 About This Song</h4>
            <p>${escapeHtml(s.description || 'No description yet.')}</p>
          </div>

          <div class="comments-box">
            <div style="font-size: 12px; color: var(--text2); letter-spacing: 2px; text-transform: uppercase; font-weight: 800; margin-bottom: 12px; display: flex; align-items: center; gap: 6px;">💬 Comments</div>
            <div class="comments-list" id="commentsList">
              <div class="comments-empty">Loading comments...</div>
            </div>
            <div class="comment-form">
              <input type="text" id="commentInput" placeholder="Write a comment..." maxlength="300" onkeypress="if(event.key==='Enter')postComment()">
              <button onclick="postComment()"><i class="fas fa-paper-plane"></i></button>
            </div>
          </div>
        `;

        document.getElementById('pollTitle').innerText = '💬 How Do You Like ' + artist + '?';

        // Update Spotify tab with this song's Spotify link
        updateSpotifyTab(s, artist);

        // Load mini avatar for chip
        try {
          const pRes = await fetch(SUPABASE_URL + '/rest/v1/artists?name=eq.' + encodeURIComponent(artist) + '&select=profile_pic&limit=1', { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } });
          const pData = await pRes.json();
          if (Array.isArray(pData) && pData.length > 0 && pData[0].profile_pic) {
            const chip = document.getElementById('chipAvatar');
            if (chip) chip.innerHTML = '<img src="' + escapeHtml(pData[0].profile_pic) + '" alt="">';
          }
        } catch (e) {}

        if (myLikes.includes(s.id)) document.getElementById('likeBtn').classList.add('liked');

        await refreshLikeCount(s.id);
        loadComments(s.id);
        loadPoll();
      } catch (e) {
        console.error(e);
        container.innerHTML = '<div class="loading">Error loading song.</div>';
      }
    }

    // ===== SPOTIFY TAB =====
    function updateSpotifyTab(song, artist) {
      const spotifyUrl = safeUrl(song.spotify);
      const card = document.getElementById('spotifyCard');
      const heading = document.getElementById('spotifyHeading');
      const text = document.getElementById('spotifyText');

      if (spotifyUrl) {
        heading.innerText = song.title;
        text.innerText = 'Stream "' + song.title + '" by ' + artist + ' on Spotify now.';
        // Append play button
        const existingBtn = card.querySelector('.spotify-play-btn');
        if (existingBtn) existingBtn.remove();
        const btn = document.createElement('a');
        btn.href = spotifyUrl;
        btn.target = '_blank';
        btn.rel = 'noopener';
        btn.className = 'spotify-play-btn';
        btn.innerHTML = '<i class="fab fa-spotify"></i> Play on Spotify';
        card.appendChild(btn);
      } else {
        heading.innerText = 'Not Yet Available';
        text.innerText = '"' + song.title + '" by ' + artist + ' isn\'t on Spotify yet — check back soon!';
        const existingBtn = card.querySelector('.spotify-play-btn');
        if (existingBtn) existingBtn.remove();
      }
    }

    // ===== ARTIST CHIP =====
    window.goToArtist = function() {
      if (!currentArtistName) return;
      window.location.href = 'artist-template.html?name=' + encodeURIComponent(currentArtistName);
    }

    async function refreshLikeCount(songId) {
      try {
        const res = await fetch(SUPABASE_URL + '/rest/v1/likes?song_id=eq.' + songId + '&select=visitor_id', {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
        });
        const data = await res.json();
        const el = document.getElementById('likeCount');
        if (el) el.innerText = data.length;
        const serverHasMyLike = data.some(l => l.visitor_id === visitorId);
        const btn = document.getElementById('likeBtn');
        if (btn) {
          if (serverHasMyLike) {
            btn.classList.add('liked');
            if (!myLikes.includes(songId)) { myLikes.push(songId); saveMyLikes(); }
          } else if (myLikes.includes(songId)) {
            myLikes = myLikes.filter(id => id !== songId);
            saveMyLikes();
            btn.classList.remove('liked');
          }
        }
      } catch (e) { console.error(e); }
    }

    window.toggleLike = async function(songId, btn) {
      const isLiked = btn.classList.contains('liked');
      const countSpan = document.getElementById('likeCount');
      const currentCount = parseInt(countSpan.innerText) || 0;

      if (isLiked) {
        btn.classList.remove('liked');
        countSpan.innerText = Math.max(0, currentCount - 1);
        myLikes = myLikes.filter(id => id !== songId);
      } else {
        btn.classList.add('liked');
        countSpan.innerText = currentCount + 1;
        if (!myLikes.includes(songId)) myLikes.push(songId);
      }
      saveMyLikes();
      btn.disabled = true;

      try {
        if (isLiked) {
          await fetch(SUPABASE_URL + '/rest/v1/likes?song_id=eq.' + songId + '&visitor_id=eq.' + visitorId, {
            method: 'DELETE',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
          });
        } else {
          await fetch(SUPABASE_URL + '/rest/v1/likes', {
            method: 'POST',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({ song_id: songId, visitor_id: visitorId, name: fanName })
          });
        }
      } catch (e) { console.error(e); }
      finally { btn.disabled = false; }
    }

    // ===== COMMENTS =====
    async function loadComments(songId) {
      const container = document.getElementById('commentsList');
      if (!container) return;
      try {
        const res = await fetch(SUPABASE_URL + '/rest/v1/comments?song_id=eq.' + songId + '&select=*&order=id.desc&limit=50', {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
        });
        const comments = await res.json();
        if (!Array.isArray(comments) || comments.length === 0) {
          container.innerHTML = '<div class="comments-empty">Be the first to comment! 💬</div>';
          return;
        }
        container.innerHTML = comments.map(c => `
          <div class="comment-item">
            <div class="comment-meta">
              <div class="comment-avatar">${escapeHtml((c.name || 'A').charAt(0).toUpperCase())}</div>
              <span class="comment-name">${escapeHtml(c.name || 'Anonymous')}</span>
            </div>
            <div class="comment-text">${escapeHtml(c.message)}</div>
          </div>
        `).join('');
      } catch (e) {
        container.innerHTML = '<div class="comments-empty">Could not load comments.</div>';
      }
    }

    window.postComment = async function() {
      if (!currentSong) return;
      const input = document.getElementById('commentInput');
      const message = input.value.trim();
      if (!message) return;

      try {
        const res = await fetch(SUPABASE_URL + '/rest/v1/comments', {
          method: 'POST',
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
          body: JSON.stringify({ song_id: currentSong.id, name: fanName, message: message })
        });
        if (res.ok) {
          input.value = '';
          loadComments(currentSong.id);
        } else {
          alert('Could not post comment.');
        }
      } catch (e) { alert('Network error.'); }
    }

    // ===== POLL (per-artist) =====
    async function loadPoll() {
      if (!currentArtistName) return;
      try {
        const artistFilter = 'artist_name=eq.' + encodeURIComponent(currentArtistName);
        const [res, myVoteRes] = await Promise.all([
          fetch(SUPABASE_URL + '/rest/v1/votes?' + artistFilter + '&select=choice', { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } }),
          fetch(SUPABASE_URL + '/rest/v1/votes?' + artistFilter + '&visitor_id=eq.' + visitorId, { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } })
        ]);
        const data = await res.json();
        const myVoteData = await myVoteRes.json();
        const counts = { love: 0, sometimes: 0, one: 0 };
        if (Array.isArray(data)) data.forEach(v => { if (counts[v.choice] !== undefined) counts[v.choice]++; });
        const myVote = (Array.isArray(myVoteData) && myVoteData.length > 0) ? myVoteData[0].choice : null;
        document.getElementById('votes-love').innerText = counts.love;
        document.getElementById('votes-sometimes').innerText = counts.sometimes;
        document.getElementById('votes-one').innerText = counts.one;
        ['love', 'sometimes', 'one'].forEach(key => {
          const box = document.getElementById('poll-' + key);
          if (key === myVote) box.classList.add('selected');
          else box.classList.remove('selected');
        });
      } catch (e) { console.error('Poll load error:', e); }
    }

    window.vote = async function(choice) {
      if (!currentArtistName) {
        alert('Please open a song first.');
        return;
      }
      try {
        const artistFilter = 'artist_name=eq.' + encodeURIComponent(currentArtistName);
        const check = await fetch(SUPABASE_URL + '/rest/v1/votes?' + artistFilter + '&visitor_id=eq.' + visitorId, {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
        });
        const existing = await check.json();
        if (Array.isArray(existing) && existing.length > 0 && existing[0].id) {
          await fetch(SUPABASE_URL + '/rest/v1/votes?id=eq.' + existing[0].id, {
            method: 'PATCH',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({ choice: choice })
          });
        } else {
          await fetch(SUPABASE_URL + '/rest/v1/votes', {
            method: 'POST',
            headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' },
            body: JSON.stringify({ choice: choice, visitor_id: visitorId, artist_name: currentArtistName })
          });
        }
        document.getElementById('pollStatus').innerText = '✅ Thanks for voting for ' + currentArtistName + '!';
        loadPoll();
      } catch (e) {
        console.error(e);
        alert('Could not save vote.');
      }
    }

    loadSong();
  </script>
</body>
</html>
