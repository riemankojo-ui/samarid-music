<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Artist - Samarid Music</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { --bg: #ffffff; --card: #f5f5f5; --border: #e5e5e5; --text: #0a0a0a; --text2: #444444; --accent: #ff0033; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, Roboto, sans-serif; min-height: 100vh; padding-bottom: 40px; }
  .header { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; gap: 10px; z-index: 100; }
  .back-btn { background: var(--card); color: var(--text); border: 1px solid var(--border); padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: 600; cursor: pointer; text-decoration: none; display: flex; align-items: center; gap: 6px; }
  .back-btn:active { background: var(--accent); color: #fff; }
  .logo { font-size: 18px; font-weight: 900; color: var(--text); text-decoration: none; flex: 1; text-align: center; }
  .logo span { color: var(--accent); }
  .container { max-width: 700px; margin: 0 auto; padding: 20px 16px; }
  .page-title { font-size: 18px; font-weight: 900; text-align: center; padding: 20px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 20px; color: var(--text); }
  .song-list { display: flex; flex-direction: column; gap: 12px; }
  .song-card { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; cursor: pointer; text-decoration: none; color: inherit; transition: all 0.2s; }
  .song-card:active { transform: scale(0.99); background: rgba(0,0,0,0.03); }
  .song-card-img { width: 110px; height: 110px; flex-shrink: 0; overflow: hidden; background: #000; border-right: 1px solid var(--border); padding: 8px; }
  .song-card-img img { width: 100%; height: 100%; object-fit: cover; display: block; border-radius: 6px; }
  .song-card-info { flex: 1; padding: 12px 14px; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .song-card-cat { font-size: 11px; color: #d4a017; font-weight: 600; margin-bottom: 4px; }
  .song-card-info h3 { font-size: 15px; font-weight: 700; line-height: 1.35; margin-bottom: 6px; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .song-card-info .date { font-size: 12px; color: #999; }
  .empty-state { text-align: center; padding: 60px 20px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; color: var(--text2); }
  .empty-state .icon { font-size: 50px; margin-bottom: 15px; }
  .empty-state h3 { font-size: 18px; margin-bottom: 8px; color: var(--text); }
  .loading { text-align: center; padding: 60px 20px; color: var(--text2); font-size: 13px; }
  .footer { padding: 30px 20px; text-align: center; font-size: 11px; color: var(--text2); border-top: 1px solid var(--border); margin-top: 40px; }
  .footer .brand { color: var(--accent); font-weight: 700; }
</style>
</head>
<body>
  <header class="header">
    <a href="artists.html" class="back-btn"><i class="fas fa-arrow-left"></i> Artists</a>
    <a href="index.html" class="logo">SAMARID <span>MUSIC</span></a>
    <div style="width: 60px;"></div>
  </header>
  <div class="container">
    <div class="page-title" id="pageTitle">Loading...</div>
    <div class="song-list" id="songList">
      <div class="loading">Loading songs...</div>
    </div>
  </div>
  <footer class="footer"><span class="brand">SAMARID MUSIC</span> © 2026</footer>
  <script>
    const SUPABASE_URL = "https://kamnfnukaizdglntcdvi.supabase.co";
    const SUPABASE_KEY = "sb_publishable__YPveWCU1NMYYsegLLYskg_38s0VRip";
    const params = new URLSearchParams(window.location.search);
    const artistName = params.get('name') || 'Samarid';
    document.title = artistName + ' - Samarid Music';
    document.getElementById('pageTitle').innerText = 'Browse - ' + artistName;
    async function loadArtistSongs() {
      const list = document.getElementById('songList');
      try {
        const res = await fetch(SUPABASE_URL + '/rest/v1/songs?artist_name=eq.' + encodeURIComponent(artistName) + '&select=*&order=id.desc', {
          headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY }
        });
        const songs = await res.json();
        if (!Array.isArray(songs) || songs.length === 0) {
          list.innerHTML = `<div class="empty-state"><div class="icon">🎵</div><h3>No Songs Yet</h3><p>Check back soon for new music!</p></div>`;
          return;
        }
        list.innerHTML = songs.map((s) => `
          <div class="song-card" onclick="window.location.href='song.html?id=${s.id}'">
            <div class="song-card-img"><img src="${s.cover}"></div>
            <div class="song-card-info">
              <div class="song-card-cat">${artistName} • ${s.category}</div>
              <h3>${s.title}</h3>
              <div class="date">${s.date}</div>
            </div>
          </div>
        `).join('');
      } catch (e) {
        console.error("Error loading songs: ", e);
        list.innerHTML = '<div class="empty-state"><div class="icon">🎵</div><h3>Could not load songs</h3><p>Check back later.</p></div>';
      }
    }
    loadArtistSongs();
  </script>
</body>
</html>
