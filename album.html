<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Album - Samarid Music</title>
<meta name="google-site-verification" content="ERHvKE-6CNknsGMv75ePLrVpOGaURdtsnmuMh1VxG-4" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { --bg: #ffffff; --border: #e5e5e5; --text: #0a0a0a; --text2: #666; --accent: #ff8800; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { overflow-x: hidden; max-width: 100vw; }
  body { background: var(--bg); color: var(--text); font-family: 'Inter', -apple-system, Roboto, sans-serif; min-height: 100vh; padding-bottom: 40px; }

  .header { position: sticky; top: 0; background: #0a0a0a; border-bottom: 1px solid #1e1e1e; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; z-index: 100; gap: 10px; }
  .back-btn { background: #1a1a1a; color: #fff; border: 1px solid #2a2a2a; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: 700; text-decoration: none; display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .back-btn:active { background: var(--accent); border-color: var(--accent); }
  .logo { font-size: 18px; font-weight: 900; letter-spacing: -0.5px; color: #ffffff; text-decoration: none; flex: 1; text-align: center; }
  .logo span { color: #ff0033; }
  .header-spacer { width: 78px; flex-shrink: 0; }

  .page-content { padding: 20px 16px 30px; max-width: 700px; margin: 0 auto; }

  /* ALBUM HERO */
  .album-hero { text-align: center; margin-bottom: 26px; padding: 20px 0; }
  .album-hero-img { width: 160px; height: 160px; border-radius: 14px; object-fit: cover; box-shadow: 0 15px 40px rgba(0,0,0,0.15); margin-bottom: 16px; border: 1px solid var(--border); }
  .album-hero-label { font-size: 10px; font-weight: 900; color: var(--accent); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px; }
  .album-hero h1 { font-size: 22px; font-weight: 900; letter-spacing: -0.6px; line-height: 1.2; margin-bottom: 10px; color: var(--text); }
  .album-hero-meta { font-size: 12px; color: var(--text2); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .album-hero-meta .artist { color: var(--accent); font-weight: 800; }
  .album-hero-meta .dot { color: #ccc; }

  /* TRACKS — same style as homepage song cards */
  .section-head { display: flex; align-items: center; gap: 10px; margin: 20px 0 14px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
  .section-head h3 { font-size: 14px; font-weight: 900; letter-spacing: -0.2px; flex: 1; color: var(--text); }
  .section-head i { color: var(--accent); font-size: 15px; }

  .song-list { display: flex; flex-direction: column; gap: 8px; }
  .song-card {
    display: flex;
    gap: 10px;
    background: #ffffff;
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    transition: all 0.2s;
    padding: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
    align-items: center;
  }
  .song-card:active { transform: scale(0.99); background: #fafafa; }
  .song-card-img { width: 30%; max-width: 90px; aspect-ratio: 1 / 1; flex-shrink: 0; overflow: hidden; background: #000; border-radius: 6px; }
  .song-card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .song-card-info { flex: 1; display: flex; flex-direction: column; justify-content: center; min-width: 0; }
  .song-card-cat { font-size: 10px; color: var(--accent); font-weight: 800; margin-bottom: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 4px; text-transform: uppercase; letter-spacing: 0.3px; }
  .song-card-info h3 { font-size: 13px; font-weight: 800; line-height: 1.2; margin-bottom: 4px; color: var(--text); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .song-card-info .date { font-size: 10px; color: var(--text2); font-weight: 600; }

  .verify-badge { display: inline-block; width: 13px; height: 13px; vertical-align: middle; flex-shrink: 0; }

  .loading, .empty { text-align: center; padding: 60px 20px; color: #999; font-size: 13px; }
  .empty-state { text-align: center; padding: 50px 20px; background: #fafafa; border: 1px solid var(--border); border-radius: 16px; color: #999; }
  .empty-state .icon { font-size: 50px; margin-bottom: 15px; }
  .empty-state h3 { font-size: 17px; margin-bottom: 8px; color: var(--text); font-weight: 900; }

  .footer { padding: 30px 20px; text-align: center; font-size: 11px; color: #888; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; border-top: 1px solid var(--border); margin-top: 30px; }
  .footer .brand { color: #ff0033; font-weight: 900; }
</style>
</head>
<body>

  <header class="header">
    <a href="albums.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back</a>
    <a href="index.html" class="logo">SAMARID <span>MUSIC</span></a>
    <div class="header-spacer"></div>
  </header>

  <div class="page-content" id="albumContent">
    <div class="loading">Loading album...</div>
  </div>

  <footer class="footer"><span class="brand">SAMARID MUSIC</span> © 2026</footer>

  <script>
    const SUPABASE_URL = "https://kamnfnukaizdglntcdvi.supabase.co";
    const SUPABASE_KEY = "sb_publishable__YPveWCU1NMYYsegLLYskg_38s0VRip";

    const VERIFY_BADGE = '<svg style="display:inline-block;width:13px;height:13px;vertical-align:middle;" viewBox="0 0 22 22"><path fill="#1d9bf0" d="M20.396 11c-.018-.646-.215-1.275-.57-1.816-.354-.54-.852-.972-1.438-1.246.223-.607.27-1.264.14-1.897-.131-.634-.437-1.218-.882-1.687-.47-.445-1.053-.75-1.687-.882-.633-.13-1.29-.083-1.897.14-.273-.587-.704-1.086-1.245-1.44S11.647 1.62 11 1.604c-.646.017-1.273.213-1.813.568s-.969.854-1.24 1.44c-.608-.223-1.267-.272-1.902-.14-.635.13-1.22.436-1.687.882-.445.47-.749 1.055-.878 1.688-.13.633-.08 1.29.144 1.896-.587.274-1.087.705-1.443 1.245-.356.54-.555 1.17-.574 1.817.02.647.218 1.276.574 1.817.356.54.856.972 1.443 1.245-.224.606-.274 1.263-.144 1.896.13.634.433 1.218.877 1.688.47.443 1.054.747 1.687.878.633.132 1.29.084 1.897-.136.274.586.705 1.084 1.246 1.439.54.354 1.17.551 1.816.569.647-.016 1.276-.213 1.817-.567s.972-.854 1.245-1.44c.604.239 1.266.296 1.903.164.636-.132 1.22-.447 1.68-.907.46-.46.776-1.044.908-1.681s.075-1.299-.165-1.903c.586-.274 1.084-.705 1.439-1.246.354-.54.551-1.17.569-1.816zM9.662 14.85l-3.429-3.428 1.293-1.302 2.072 2.072 4.4-4.794 1.347 1.246z"/></svg>';

    async function loadAlbum() {
      const params = new URLSearchParams(window.location.search);
      const albumName = params.get('name');
      const container = document.getElementById('albumContent');

      if (!albumName) {
        container.innerHTML = '<div class="empty-state"><div class="icon">📀</div><h3>No Album Selected</h3><p>Please go back and pick an album.</p></div>';
        return;
      }

      try {
        const res = await fetch(
          SUPABASE_URL + '/rest/v1/songs?album_name=eq.' + encodeURIComponent(albumName) + '&select=*&order=id.asc',
          { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } }
        );
        const songs = await res.json();

        if (!Array.isArray(songs) || songs.length === 0) {
          container.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><h3>Album Not Found</h3></div>';
          return;
        }

        const first = songs[0];
        const artist = first.artist_name || 'Samarid';
        const badge = first.verified ? VERIFY_BADGE : '';
        const cover = first.cover;
        const category = first.category || 'Music';
        const date = first.date || '';
        const songCount = songs.length;
        const songLabel = songCount === 1 ? '1 track' : songCount + ' tracks';

        document.title = albumName + ' by ' + artist + ' - Samarid Music';

        container.innerHTML = `
          <div class="album-hero">
            <img src="${cover}" alt="${albumName}" class="album-hero-img">
            <div class="album-hero-label">Album</div>
            <h1>${albumName}</h1>
            <div class="album-hero-meta">
              <span class="artist">${artist}${badge}</span>
              <span class="dot">•</span>
              <span>${category}</span>
              <span class="dot">•</span>
              <span>${date}</span>
              <span class="dot">•</span>
              <span>${songLabel}</span>
            </div>
          </div>

          <div class="section-head">
            <i class="fas fa-music"></i>
            <h3>Tracks</h3>
          </div>
          <div class="song-list">
            ${songs.map(s => `
              <a href="song.html?id=${s.id}" class="song-card">
                <div class="song-card-img"><img src="${s.cover}" alt="${s.title}"></div>
                <div class="song-card-info">
                  <div class="song-card-cat">${artist}${badge} • ${s.category || 'Music'}</div>
                  <h3>${s.title}</h3>
                  <div class="date">${s.date || ''}</div>
                </div>
              </a>
            `).join('')}
          </div>
        `;
      } catch (e) {
        console.error(e);
        container.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><h3>Error Loading</h3></div>';
      }
    }

    loadAlbum();
  </script>
</body>
</html>
