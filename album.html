<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Album - Samarid Music</title>
<meta name="description" content="Listen to full albums from Samarid Music — Ghana's newest music label.">
<meta name="google-site-verification" content="ERHvKE-6CNknsGMv75ePLrVpOGaURdtsnmuMh1VxG-4" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { --bg: #ffffff; --border: #e5e5e5; --text: #0a0a0a; --text2: #666; --accent: #ff0033; --red: #ff0033; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; min-width: 0; }
  html, body { overflow-x: hidden; max-width: 100vw; }
  body { background: #fafafa; color: var(--text); font-family: 'Inter', -apple-system, Roboto, sans-serif; min-height: 100vh; padding-bottom: 40px; }
  img { max-width: 100%; }
  .header { position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; gap: 8px; z-index: 100; }
  .menu-btn { background: transparent; color: var(--text); border: none; width: 40px; height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; flex-shrink: 0; padding: 0; }
  .menu-btn span { display: block; width: 22px; height: 2px; background: var(--text); border-radius: 2px; }
  .menu-btn:active span { background: var(--accent); }
  .logo { font-size: 18px; font-weight: 900; color: var(--text); text-decoration: none; flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 8px; }
  .logo span { color: var(--red); }
  .header-spacer { width: 40px; flex-shrink: 0; }
  .menu-dropdown { position: fixed; top: 66px; left: 12px; background: #141414; border: 1px solid #2a2a2a; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.7); width: 250px; max-width: calc(100vw - 24px); max-height: 70vh; overflow-y: auto; display: none; z-index: 9999; }
  .menu-dropdown.open { display: block; }
  .menu-title { padding: 14px 18px 8px; font-size: 10px; color: #666; letter-spacing: 2px; font-weight: 700; text-transform: uppercase; }
  .menu-item { padding: 13px 18px; font-size: 14px; color: #fff; cursor: pointer; display: flex; align-items: center; gap: 12px; text-decoration: none; background: transparent; border: none; width: 100%; font-family: inherit; text-align: left; }
  .menu-item:active { background: #1f1f1f; }
  .menu-item i { width: 20px; text-align: center; font-size: 15px; color: var(--red); flex-shrink: 0; }
  .menu-item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu-divider { height: 1px; background: #222; margin: 4px 0; }
  .menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9998; display: none; }
  .menu-overlay.open { display: block; }
  .page-content { padding: 20px 16px 30px; max-width: 700px; margin: 0 auto; }

  .pb-block { margin-bottom: 20px; padding: 18px 20px; border-radius: 14px; }
  .pb-block.pb-image { padding: 0; overflow: hidden; }
  .pb-block.pb-image img { width: 100%; display: block; border-radius: 14px; }

  .album-hero { text-align: center; margin-bottom: 26px; padding: 20px 0; }
  .album-hero-img { width: 170px; height: 170px; border-radius: 14px; object-fit: cover; box-shadow: 0 15px 40px rgba(0,0,0,0.15); margin-bottom: 16px; border: 1px solid var(--border); }
  .album-hero-label { font-size: 10px; font-weight: 900; color: var(--accent); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px; }
  .album-hero h1 { font-size: 22px; font-weight: 900; letter-spacing: -0.6px; line-height: 1.2; margin-bottom: 10px; color: var(--text); overflow-wrap: anywhere; word-break: break-word; }
  .album-hero-meta { font-size: 12px; color: var(--text2); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; }
  .album-hero-meta .artist { color: var(--accent); font-weight: 800; }
  .album-hero-meta .dot { color: #ccc; }
  .album-hero-meta .meta-green { color: #8fdfa8; font-weight: 700; }

  .page-title { font-size: 12px; font-weight: 800; color: var(--text2); letter-spacing: 0.5px; padding: 8px 0 14px; text-align: left; text-transform: uppercase; }
  .song-list { display: flex; flex-direction: column; }
  .song-card { display: flex; gap: 14px; padding: 14px 0; background: transparent; border: none; border-bottom: 1px solid var(--border); cursor: pointer; text-decoration: none; color: inherit; align-items: center; }
  .song-card:last-child { border-bottom: none; }
  .song-card-img { width: 96px; height: 96px; flex-shrink: 0; overflow: hidden; background: #000; border-radius: 12px; }
  .song-card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .song-card-info { flex: 1; display: flex; flex-direction: column; justify-content: center; min-width: 0; gap: 6px; }
  .song-card-info .genre-country { font-size: 10px; font-weight: 600; color: #8fdfa8; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 2px; }
  .song-card-info h3 { font-size: 13.5px; font-weight: 800; line-height: 1.3; color: #000000; letter-spacing: -0.2px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; overflow-wrap: anywhere; word-break: break-word; transition: color 0.15s ease; }
  .song-card-info h3 .dash { font-weight: 600; color: #000000; margin: 0 2px; }
  .song-card-info h3 .feat-tag { font-weight: 800; color: #000000; font-size: 13.5px; }
  .song-card-info .date { font-size: 11px; color: #888888; font-weight: 400; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* ===== TAP / HOVER EFFECT (title only) ===== */
  @media (hover: hover) and (pointer: fine) {
    .song-card:hover .song-card-info h3 { color: var(--accent); }
  }
  .song-card:active .song-card-info h3 { color: var(--accent); }

  .loading, .empty { text-align: center; padding: 60px 20px; color: #999; font-size: 13px; }
  .empty-state { text-align: center; padding: 50px 20px; background: #fff; border: 1px solid var(--border); border-radius: 16px; color: #999; }
  .empty-state .icon { font-size: 50px; margin-bottom: 15px; }
  .empty-state h3 { font-size: 17px; margin-bottom: 8px; color: var(--text); font-weight: 900; }
  .footer { padding: 30px 20px; text-align: center; font-size: 11px; color: #888; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; border-top: 1px solid var(--border); margin-top: 30px; }
  .footer .brand { color: var(--red); font-weight: 900; }
</style>
</head><body>

  <header class="header">
    <button class="menu-btn" onclick="toggleMenu(event)" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <a href="index.html" class="logo">SAMARID <span>MUSIC</span></a>
    <div class="header-spacer"></div>
  </header>

  <div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>
  <div class="menu-dropdown" id="menuDropdown" onclick="event.stopPropagation()">
    <div class="menu-title">Navigation</div>
    <a href="index.html" class="menu-item"><i class="fas fa-music"></i><span class="label">Music</span></a>
    <a href="search.html" class="menu-item"><i class="fas fa-search"></i><span class="label">Search</span></a>
    <a href="weekend.html" class="menu-item"><i class="fas fa-fire"></i><span class="label">Weekend Trend</span></a>
    <a href="albums.html" class="menu-item"><i class="fas fa-compact-disc"></i><span class="label">Albums</span></a>
    <a href="artists.html" class="menu-item"><i class="fas fa-user-group"></i><span class="label">Artists</span></a>
    <a href="videos.html" class="menu-item"><i class="fas fa-video"></i><span class="label">Videos</span></a>
    <div class="menu-divider"></div>
    <div class="menu-title">More</div>
    <a href="about.html" class="menu-item"><i class="fas fa-info-circle"></i><span class="label">About</span></a>
    <a href="promo.html" class="menu-item"><i class="fas fa-bullhorn"></i><span class="label">Promo</span></a>
    <a href="distributors.html" class="menu-item"><i class="fas fa-headphones"></i><span class="label">Get On Spotify</span></a>
  </div>

  <div class="page-content">

    <div id="pageBuilderBlocks"></div>

    <div id="albumContent">
      <div class="loading">Loading album...</div>
    </div>
  </div>

  <footer class="footer"><span class="brand">SAMARID MUSIC</span> © 2026</footer>

  <script>
    const SUPABASE_URL = "https://kamnfnukaizdglntcdvi.supabase.co";
    const SUPABASE_KEY = "sb_publishable__YPveWCU1NMYYsegLLYskg_38s0VRip";

    function escapeHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    window.toggleMenu = function(e) {
      e.stopPropagation();
      const menu = document.getElementById('menuDropdown');
      const overlay = document.getElementById('menuOverlay');
      if (menu.classList.contains('open')) { menu.classList.remove('open'); overlay.classList.remove('open'); }
      else { menu.classList.add('open'); overlay.classList.add('open'); }
    }
    window.closeMenu = function() { document.getElementById('menuDropdown').classList.remove('open'); document.getElementById('menuOverlay').classList.remove('open'); }

    const LIVE_FILTER = '&or=(status.eq.live,status.is.null,release_at.lte.' + encodeURIComponent(new Date().toISOString()) + ')';

    async function loadPageBuilderBlocks() {
      const container = document.getElementById('pageBuilderBlocks');
      if (!container) return;
      try {
        const res = await fetch(SUPABASE_URL + '/rest/v1/content_blocks?page_key=eq.album&active=eq.true&select=*&order=sort_order.asc,id.asc', { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } });
        const blocks = await res.json();
        if (!Array.isArray(blocks) || blocks.length === 0) { container.innerHTML = ''; return; }
        const sizes = { small: '12px', medium: '15px', large: '20px', xlarge: '28px', huge: '38px' };
        const weights = { normal: '500', bold: '800', black: '900' };
        container.innerHTML = blocks.map(b => {
          const color = b.text_color || '#ffffff';
          const size = sizes[b.text_size] || '15px';
          const weight = weights[b.font_weight] || '500';
          const align = b.text_align || 'center';
          const bg = b.bg_color || 'transparent';
          const styleStr = 'color:' + color + '; font-size:' + size + '; font-weight:' + weight + '; text-align:' + align + '; line-height:1.45;';
          const wrapStyle = 'background:' + bg + '; border-radius:14px; padding:18px 20px; margin-bottom:20px; overflow-wrap:anywhere; word-break:break-word;';
          if (b.block_type === 'spacer') { const h = parseInt(b.content) || 40; return '<div style="height:' + h + 'px; margin-bottom:20px;"></div>'; }
          if (b.block_type === 'image') { if (!b.content) return ''; return '<div style="margin-bottom:20px;"><img src="' + escapeHtml(b.content) + '" alt="' + escapeHtml(b.button_text || 'Image') + '" style="width:100%; display:block; border-radius:14px;"></div>'; }
          if (b.block_type === 'button') { const txt = b.content || b.button_text || 'Click Here'; const link = b.button_link || '#'; return '<div style="' + wrapStyle + ' text-align:' + align + ';"><a href="' + escapeHtml(link) + '" style="display:inline-block; padding:14px 28px; background:#ff0033; color:#fff; border-radius:30px; font-size:14px; font-weight:900; text-decoration:none; box-shadow:0 8px 24px rgba(255,0,51,0.35);">' + escapeHtml(txt) + '</a></div>'; }
          if (b.block_type === 'hero') { const btnText = b.button_text ? '<a href="' + escapeHtml(b.button_link || '#') + '" style="display:inline-block; margin-top:16px; padding:13px 28px; background:#ff0033; color:#fff; border-radius:30px; font-size:13px; font-weight:900; text-decoration:none; box-shadow:0 8px 24px rgba(255,0,51,0.35);">' + escapeHtml(b.button_text) + '</a>' : ''; return '<div style="' + wrapStyle + ' ' + styleStr + '">' + escapeHtml(b.content || '') + (btnText ? '<div style="text-align:' + align + '; margin-top:16px;">' + btnText + '</div>' : '') + '</div>'; }
          if (b.block_type === 'heading') { return '<div style="' + wrapStyle + ' ' + styleStr + '">' + escapeHtml(b.content || '') + '</div>'; }
          const btnText = b.button_text ? '<div style="margin-top:14px;"><a href="' + escapeHtml(b.button_link || '#') + '" style="display:inline-block; padding:12px 24px; background:#ff0033; color:#fff; border-radius:30px; font-size:13px; font-weight:900; text-decoration:none;">' + escapeHtml(b.button_text) + '</a></div>' : '';
          return '<div style="' + wrapStyle + ' ' + styleStr + '">' + escapeHtml(b.content || '') + btnText + '</div>';
        }).join('');
      } catch (e) { container.innerHTML = ''; }
    }

    async function loadAlbum() {
      const params = new URLSearchParams(window.location.search);
      const albumName = params.get('name');
      const container = document.getElementById('albumContent');

      if (!albumName || !albumName.trim()) {
        container.innerHTML = '<div class="empty-state"><div class="icon">📀</div><h3>No Album Selected</h3><p>Please go back and pick an album.</p></div>';
        return;
      }

      try {
        const res = await fetch(SUPABASE_URL + '/rest/v1/songs?album_name=eq.' + encodeURIComponent(albumName) + '&select=*' + LIVE_FILTER + '&order=id.asc', { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } });
        const songs = await res.json();

        if (!Array.isArray(songs) || songs.length === 0) {
          container.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><h3>Album Not Found</h3></div>';
          return;
        }

        const first = songs[0];
        const artist = (first.artist_name || 'Samarid').trim();
        const featuring = (first.featuring || '').trim();
        const cover = first.cover;
        const category = first.category || 'Music';
        const country = first.country || 'Ghana';
        const date = first.date || '';
        const songCount = songs.length;
        const songLabel = songCount === 1 ? '1 track' : songCount + ' tracks';

        document.title = albumName + ' by ' + artist + ' - Samarid Music';

        const featHTML = featuring ? ' <span class="feat-tag" style="color:#000000; font-weight:800;">Feat ' + escapeHtml(featuring) + '</span>' : '';

        container.innerHTML = `
          <div class="album-hero">
            <img src="${escapeHtml(cover)}" alt="${escapeHtml(albumName)}" class="album-hero-img">
            <div class="album-hero-label">Album</div>
            <h1>${escapeHtml(albumName)}</h1>
            <div class="album-hero-meta">
              <span class="artist">${escapeHtml(artist)}</span>${featHTML}
              <span class="dot">•</span>
              <span class="meta-green">${escapeHtml(category)} • ${escapeHtml(country)}</span>
              <span class="dot">•</span>
              <span>${escapeHtml(date)}</span>
              <span class="dot">•</span>
              <span>${songLabel}</span>
            </div>
          </div>

          <div class="page-title">Tracks</div>
          <div class="song-list">
            ${songs.map(s => {
              const sArtist = (s.artist_name || 'Samarid').trim();
              const sFeat = (s.featuring || '').trim();
              const sGenre = s.category || 'Music';
              const sCountry = s.country || 'Ghana';
              const sFeatHTML = sFeat ? ' <span class="feat-tag">Feat ' + escapeHtml(sFeat) + '</span>' : '';
              return '<a href="song.html?id=' + s.id + '" class="song-card"><div class="song-card-img"><img src="' + escapeHtml(s.cover) + '" alt="' + escapeHtml(s.title) + '" loading="lazy"></div><div class="song-card-info"><div class="genre-country">' + escapeHtml(sGenre) + ' • ' + escapeHtml(sCountry) + '</div><h3>' + escapeHtml(sArtist) + sFeatHTML + '<span class="dash"> - </span>' + escapeHtml(s.title) + '</h3><div class="date">' + escapeHtml(s.date || '') + '</div></div></a>';
            }).join('')}
          </div>
        `;
      } catch (e) {
        console.error(e);
        container.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><h3>Error Loading</h3></div>';
      }
    }

    loadPageBuilderBlocks();
    loadAlbum();
  </script>
</body>
</html>
