<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Album - Samarid Music</title>
<meta name="description" content="Listen to full albums from Samarid Music — Ghana's newest music label.">
<meta name="google-site-verification" content="ERHvKE-6CNknsGMv75ePLrVpOGaURdtsnmuMh1VxG-4" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
  :root { --bg: #ffffff; --border: #e5e5e5; --text: #0a0a0a; --text2: #666; --accent: #ff8800; --red: #ff0033; }
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; min-width: 0; }
  html, body { overflow-x: hidden; max-width: 100vw; }
  body { background: #fafafa; color: var(--text); font-family: 'Inter', -apple-system, Roboto, sans-serif; min-height: 100vh; padding-bottom: 40px; }
  img { max-width: 100%; }

  .header { position: sticky; top: 0; background: #fff; border-bottom: 1px solid var(--border); padding: 12px 16px; display: flex; align-items: center; gap: 8px; z-index: 100; }
  .menu-btn { background: transparent; color: var(--text); border: none; width: 40px; height: 40px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; cursor: pointer; flex-shrink: 0; padding: 0; }
  .menu-btn span { display: block; width: 22px; height: 2px; background: var(--text); border-radius: 2px; transition: background 0.2s; }
  .menu-btn:active span { background: var(--accent); }
  .logo { font-size: 18px; font-weight: 900; color: var(--text); text-decoration: none; flex: 1; text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 8px; }
  .logo span { color: var(--red); }
  .header-spacer { width: 40px; flex-shrink: 0; }

  /* MENU DROPDOWN */
  .menu-dropdown { position: fixed; top: 66px; left: 12px; background: #141414; border: 1px solid #2a2a2a; border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,0.7); width: 250px; max-width: calc(100vw - 24px); max-height: 70vh; overflow-y: auto; display: none; z-index: 9999; }
  .menu-dropdown.open { display: block; animation: menuPop 0.2s ease; }
  @keyframes menuPop { from { opacity: 0; transform: translateY(-8px) scale(0.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
  .menu-title { padding: 14px 18px 8px; font-size: 10px; color: #666; letter-spacing: 2px; font-weight: 700; text-transform: uppercase; }
  .menu-item { padding: 13px 18px; font-size: 14px; color: #fff; cursor: pointer; display: flex; align-items: center; gap: 12px; text-decoration: none; transition: background 0.15s; background: transparent; border: none; width: 100%; font-family: inherit; text-align: left; }
  .menu-item:active { background: #1f1f1f; }
  .menu-item i { width: 20px; text-align: center; font-size: 15px; color: var(--red); flex-shrink: 0; }
  .menu-item .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .menu-divider { height: 1px; background: #222; margin: 4px 0; }
  .menu-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 9998; display: none; }
  .menu-overlay.open { display: block; }

  .page-content { padding: 20px 16px 30px; max-width: 700px; margin: 0 auto; }

  /* ALBUM HERO */
  .album-hero { text-align: center; margin-bottom: 26px; padding: 20px 0; }
  .album-hero-img { width: 170px; height: 170px; border-radius: 14px; object-fit: cover; box-shadow: 0 15px 40px rgba(0,0,0,0.15); margin-bottom: 16px; border: 1px solid var(--border); }
  .album-hero-label { font-size: 10px; font-weight: 900; color: var(--accent); letter-spacing: 3px; text-transform: uppercase; margin-bottom: 8px; }
  .album-hero h1 { font-size: 22px; font-weight: 900; letter-spacing: -0.6px; line-height: 1.2; margin-bottom: 10px; color: var(--text); overflow-wrap: anywhere; word-break: break-word; max-width: 100%; }
  .album-hero-meta { font-size: 12px; color: var(--text2); font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; max-width: 100%; overflow: hidden; }
  .album-hero-meta .artist { color: var(--accent); font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .album-hero-meta .dot { color: #ccc; }

  /* Section title */
  .page-title {
    font-size: 12px;
    font-weight: 800;
    color: var(--text2);
    letter-spacing: 0.5px;
    padding: 8px 0 14px;
    text-align: left;
    text-transform: uppercase;
  }
  .page-title .accent { color: var(--text); font-weight: 900; }

  /* ===== CLEAN TRACK LIST ===== */
  .song-list { display: flex; flex-direction: column; }

  .song-card {
    display: flex;
    gap: 14px;
    padding: 14px 0;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    text-decoration: none;
    color: inherit;
    align-items: center;
    transition: opacity 0.15s;
  }
  .song-card:last-child { border-bottom: none; }
  .song-card:active { opacity: 0.7; }

  .song-card-img {
    width: 96px;
    height: 96px;
    flex-shrink: 0;
    overflow: hidden;
    background: #000;
    border-radius: 12px;
    position: relative;
  }
  .song-card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }

  .song-card-info {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-width: 0;
    gap: 6px;
  }
  .song-card-info h3 {
    font-size: 14px;
    font-weight: 800;
    line-height: 1.35;
    color: var(--text);
    letter-spacing: -0.2px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
    overflow-wrap: anywhere;
    word-break: break-word;
    max-width: 100%;
  }
  .song-card-info h3 .dash {
    font-weight: 600;
    color: var(--text);
    margin: 0 2px;
  }
  .song-card-info .date {
    font-size: 12.5px;
    color: var(--text2);
    font-weight: 500;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .verify-badge { display: inline-block; width: 14px; height: 14px; vertical-align: middle; flex-shrink: 0; margin: 0 2px; }

  .loading, .empty { text-align: center; padding: 60px 20px; color: #999; font-size: 13px; }
  .empty-state { text-align: center; padding: 50px 20px; background: #fff; border: 1px solid var(--border); border-radius: 16px; color: #999; }
  .empty-state .icon { font-size: 50px; margin-bottom: 15px; }
  .empty-state h3 { font-size: 17px; margin-bottom: 8px; color: var(--text); font-weight: 900; }
  .empty-state p { overflow-wrap: anywhere; word-break: break-word; }

  .footer { padding: 30px 20px; text-align: center; font-size: 11px; color: #888; letter-spacing: 1.5px; text-transform: uppercase; font-weight: 600; border-top: 1px solid var(--border); margin-top: 30px; }
  .footer .brand { color: var(--red); font-weight: 900; }
</style>
</head>
<body>

  <header class="header">
    <button class="menu-btn" onclick="toggleMenu(event)" aria-label="Menu">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <a href="index.html" class="logo">SAMARID <span>MUSIC</span></a>
    <div class="header-spacer"></div>
  </header>

  <div class="menu-overlay" id="menuOverlay" onclick="closeMenu()"></div>
  <div class="menu-dropdown" id="menuDropdown" onclick="event.stopPropagation()">
    <div class="menu-title">Navigation</div>
    <a href="index.html" class="menu-item"><i class="fas fa-music"></i><span class="label">Music</span></a>
    <a href="albums.html" class="menu-item"><i class="fas fa-compact-disc"></i><span class="label">Albums</span></a>
    <a href="artists.html" class="menu-item"><i class="fas fa-user-group"></i><span class="label">Artists</span></a>
    <a href="videos.html" class="menu-item"><i class="fas fa-video"></i><span class="label">Videos</span></a>
    <a href="fanbase.html" class="menu-item"><i class="fas fa-heart"></i><span class="label">Fanbase</span></a>
    <div class="menu-divider"></div>
    <div class="menu-title">More</div>
    <a href="about.html" class="menu-item"><i class="fas fa-info-circle"></i><span class="label">About</span></a>
    <a href="promo.html" class="menu-item"><i class="fas fa-bullhorn"></i><span class="label">Promo</span></a>
    <a href="distributors.html" class="menu-item"><i class="fas fa-headphones"></i><span class="label">Get On Spotify</span></a>
  </div>

  <div class="page-content" id="albumContent">
    <div class="loading">Loading album...</div>
  </div>

  <footer class="footer"><span class="brand">SAMARID MUSIC</span> © 2026</footer>

  <script>
    const SUPABASE_URL = "https://kamnfnukaizdglntcdvi.supabase.co";
    const SUPABASE_KEY = "sb_publishable__YPveWCU1NMYYsegLLYskg_38s0VRip";

    const VERIFY_BADGE = '<svg class="verify-badge" viewBox="0 0 22 22"><path fill="#1d9bf0" d="M20.396 11c-.018-.646-.215-1.275-.57-1.816-.354-.54-.852-.972-1.438-1.246.223-.607.27-1.264.14-1.897-.131-.634-.437-1.218-.882-1.687-.47-.445-1.053-.75-1.687-.882-.633-.13-1.29-.083-1.897.14-.273-.587-.704-1.086-1.245-1.44S11.647 1.62 11 1.604c-.646.017-1.273.213-1.813.568s-.969.854-1.24 1.44c-.608-.223-1.267-.272-1.902-.14-.635.13-1.22.436-1.687.882-.445.47-.749 1.055-.878 1.688-.13.633-.08 1.29.144 1.896-.587.274-1.087.705-1.443 1.245-.356.54-.555 1.17-.574 1.817.02.647.218 1.276.574 1.817.356.54.856.972 1.443 1.245-.224.606-.274 1.263-.144 1.896.13.634.433 1.218.877 1.688.47.443 1.054.747 1.687.878.633.132 1.29.084 1.897-.136.274.586.705 1.084 1.246 1.439.54.354 1.17.551 1.816.569.647-.016 1.276-.213 1.817-.567s.972-.854 1.245-1.44c.604.239 1.266.296 1.903.164.636-.132 1.22-.447 1.68-.907.46-.46.776-1.044.908-1.681s.075-1.299-.165-1.903c.586-.274 1.084-.705 1.439-1.246.354-.54.551-1.17.569-1.816zM9.662 14.85l-3.429-3.428 1.293-1.302 2.072 2.072 4.4-4.794 1.347 1.246z"/></svg>';

    function escapeHtml(s) {
      if (s === null || s === undefined) return '';
      return String(s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    window.toggleMenu = function(e) {
      e.stopPropagation();
      const menu = document.getElementById('menuDropdown');
      const overlay = document.getElementById('menuOverlay');
      if (menu.classList.contains('open')) {
        menu.classList.remove('open');
        overlay.classList.remove('open');
      } else {
        menu.classList.add('open');
        overlay.classList.add('open');
      }
    }
    window.closeMenu = function() {
      document.getElementById('menuDropdown').classList.remove('open');
      document.getElementById('menuOverlay').classList.remove('open');
    }

    async function loadAlbum() {
      const params = new URLSearchParams(window.location.search);
      const albumName = params.get('name');
      const container = document.getElementById('albumContent');

      if (!albumName || !albumName.trim()) {
        container.innerHTML = '<div class="empty-state"><div class="icon">📀</div><h3>No Album Selected</h3><p>Please go back and pick an album.</p></div>';
        return;
      }

      try {
        const res = await fetch(
          SUPABASE_URL + '/rest/v1/songs?album_name=eq.' + encodeURIComponent(albumName) + '&select=*&order=id.asc',
          { headers: { 'apikey': SUPABASE_KEY, 'Authorization': 'Bearer ' + SUPABASE_KEY } }
        );
        const songs = await res.json();

        if (!Array.isArray(songs) || songs.length === 0) {
          container.innerHTML = '<div class="empty-state"><div class="icon">🔍</div><h3>Album Not Found</h3></div>';
          return;
        }

        const first = songs[0];
        const artist = first.artist_name || 'Samarid';
        const badge = first.verified ? VERIFY_BADGE : '';
        const cover = first.cover;
        const category = first.category || 'Music';
        const date = first.date || '';
        const songCount = songs.length;
        const songLabel = songCount === 1 ? '1 track' : songCount + ' tracks';

        document.title = albumName + ' by ' + artist + ' - Samarid Music';

        container.innerHTML = `
          <div class="album-hero">
            <img src="${escapeHtml(cover)}" alt="${escapeHtml(albumName)}" class="album-hero-img">
            <div class="album-hero-label">Album</div>
            <h1>${escapeHtml(albumName)}</h1>
            <div class="album-hero-meta">
              <span class="artist">${escapeHtml(artist)}${badge}</span>
              <span class="dot">•</span>
              <span>${escapeHtml(category)}</span>
              <span class="dot">•</span>
              <span>${escapeHtml(date)}</span>
              <span class="dot">•</span>
              <span>${songLabel}</span>
            </div>
          </div>

          <div class="page-title">Tracks</div>
          <div class="song-list">
            ${songs.map(s => `
              <a href="song-details.html?id=${s.id}" class="song-card">
                <div class="song-card-img"><img src="${escapeHtml(s.cover)}" alt="${escapeHtml(s.title)}" loading="lazy"></div>
                <div class="song-card-info">
                  <h3>${escapeHtml(artist)}${badge}<span class="dash"> - </span>${escapeHtml(s.title)}</h3>
                  <div class="date">${escapeHtml(s.date || '')}</div>
                </div>
              </a>
            `).join('')}
          </div>
        `;
      } catch (e) {
        console.error(e);
        container.innerHTML = '<div class="empty-state"><div class="icon">⚠️</div><h3>Error Loading</h3></div>';
      }
    }

    loadAlbum();
  </script>
</body>
</html>
