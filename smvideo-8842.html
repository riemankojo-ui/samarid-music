<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Test Video - FlexTune Studio</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b0b0b;color:#fff;font-family:Inter,system-ui,sans-serif;padding:16px 16px 40px;max-width:520px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.back{color:#d97706;text-decoration:none;font-weight:700;font-size:14px}
h1{font-size:20px;margin:0}
.song{display:flex;gap:12px;align-items:center;background:#121212;border:1px solid #2a2a2a;border-radius:4px;padding:12px;margin-bottom:12px}
.song img{width:56px;height:56px;object-fit:cover;background:#222;border-radius:4px}
.song b{display:block;font-size:15px}
.song span{font-size:12px;color:#888}
.now{font-size:12px;color:#999;margin-bottom:16px;word-break:break-all}
.now a{color:#ff0033}
.card{background:#121212;border:1px solid #2a2a2a;border-radius:4px;padding:12px;margin-bottom:14px}
.tag{font-size:12px;font-weight:700;color:#d97706;text-transform:uppercase;letter-spacing:.05em}
.thumb{position:relative;width:100%;aspect-ratio:16/9;background:#000;margin:8px 0;border-radius:4px;overflow:hidden}
.thumb img,.thumb iframe{width:100%;height:100%;object-fit:cover;border:0;display:block}
.play{position:absolute;inset:0;width:100%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);border:0;color:#fff;font-size:34px}
.t{font-size:13px;word-break:break-word}
.c{font-size:11px;color:#888;margin-bottom:8px}
.btn{width:100%;padding:11px;border:0;border-radius:4px;font-weight:700;font-size:13px;margin-top:6px}
.use{background:#d97706;color:#000}
.ghost{background:#222;color:#fff;border:1px solid #444}
.msg{font-size:13px;color:#999;padding:10px 0}
.good{color:#22c55e}
</style>
</head>
<body>
<div class="top"><a class="back" href="smstudio-8842.html">&larr; Studio</a><h1>Test Video</h1></div>
<div class="song"><img id="cover" alt=""><div><b id="sTitle">Loading...</b><span id="sArtist"></span></div></div>
<div class="now" id="now"></div>
<div id="list"><div class="msg">Searching YouTube...</div></div>
<button class="btn ghost" id="skip">Skip - let the finder decide</button>
<button class="btn ghost" id="reset">Reset to auto finder</button>
<div class="msg" id="status"></div>

<script>
const SUPABASE_URL = "https://kamnfnukaizdglntcdvi.supabase.co";
const SUPABASE_KEY = "sb_publishable__YPveWCU1NMYYsegLLYskg_38s0VRip";
const SONGS_TABLE = "songs";
const id = (new URLSearchParams(location.search).get('id') || '').trim();
const H = { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY, 'Content-Type': 'application/json' };
const $ = function (s) { return document.getElementById(s); };

function dec(s) { var t = document.createElement('textarea'); t.innerHTML = s || ''; return t.value; }
function vidId(u) { try { return new URL(u).searchParams.get('v') || ''; } catch (e) { return ''; } }

function showNow(song) {
  var box = $('now'); box.textContent = '';
  var link = song.youtube || song.auto_youtube;
  if (!link) { box.textContent = 'Song page is showing: nothing yet'; return; }
  box.appendChild(document.createTextNode((song.youtube ? 'Song page is showing your pick: ' : 'Song page is showing the auto result: ')));
  var a = document.createElement('a'); a.href = link; a.target = '_blank'; a.textContent = 'Watch'; box.appendChild(a);
}

function loadSong() {
  return fetch(SUPABASE_URL + '/rest/v1/' + SONGS_TABLE + '?id=eq.' + encodeURIComponent(id) + '&select=title,artist_name,cover,youtube,auto_youtube&limit=1', { headers: H })
    .then(function (r) { return r.json(); })
    .then(function (rows) {
      var s = rows && rows[0]; if (!s) { $('sTitle').textContent = 'Song not found'; return null; }
      $('sTitle').textContent = s.title || '';
      $('sArtist').textContent = s.artist_name || '';
      if (s.cover) $('cover').src = s.cover;
      showNow(s); return s;
    });
}

function save(url, label) {
  $('status').className = 'msg'; $('status').textContent = 'Saving...';
  fetch(SUPABASE_URL + '/rest/v1/' + SONGS_TABLE + '?id=eq.' + encodeURIComponent(id), { method: 'PATCH', headers: H, body: JSON.stringify({ youtube: url }) })
    .then(function (r) {
      if (!r.ok) throw new Error('save failed');
      $('status').className = 'msg good'; $('status').textContent = label + ' saved. It now shows on the song page.';
      return loadSong();
    })
    .catch(function (e) { $('status').className = 'msg'; $('status').textContent = 'Could not save: ' + e.message; });
}

function render(list) {
  var box = $('list'); box.textContent = '';
  if (!list.length) { var m = document.createElement('div'); m.className = 'msg'; m.textContent = 'No matches found. The finder will keep checking.'; box.appendChild(m); return; }
  list.forEach(function (v) {
    var card = document.createElement('div'); card.className = 'card';
    card.innerHTML = '<div class="tag"></div><div class="thumb"><img><button class="play" type="button">&#9654;</button></div><div class="t"></div><div class="c"></div><button class="btn use" type="button">Use this video</button>';
    card.querySelector('.tag').textContent = v.label;
    card.querySelector('img').src = v.thumb || '';
    card.querySelector('.t').textContent = dec(v.title);
    card.querySelector('.c').textContent = dec(v.channel);
    card.querySelector('.play').onclick = function () {
      var th = card.querySelector('.thumb'); th.textContent = '';
      var f = document.createElement('iframe'); f.src = 'https://www.youtube.com/embed/' + encodeURIComponent(vidId(v.url)) + '?autoplay=1'; f.allow = 'autoplay; encrypted-media; fullscreen'; f.allowFullscreen = true; th.appendChild(f);
    };
    card.querySelector('.use').onclick = function () { save(v.url, v.label); };
    box.appendChild(card);
  });
}

$('skip').onclick = function () { location.href = 'smstudio-8842.html'; };
$('reset').onclick = function () {
  $('status').className = 'msg'; $('status').textContent = 'Resetting...';
  fetch(SUPABASE_URL + '/rest/v1/' + SONGS_TABLE + '?id=eq.' + encodeURIComponent(id), { method: 'PATCH', headers: H, body: JSON.stringify({ youtube: null }) })
    .then(function () { return fetch('/api/find-video?id=' + encodeURIComponent(id) + '&force=1'); })
    .then(function () { return loadSong(); })
    .then(function () { $('status').className = 'msg good'; $('status').textContent = 'Back on the auto finder.'; })
    .catch(function (e) { $('status').textContent = 'Reset failed: ' + e.message; });
};

if (!/^[0-9a-zA-Z-]+$/.test(id)) {
  $('list').innerHTML = '<div class="msg">No song selected.</div>';
} else {
  loadSong();
  fetch('/api/find-video?id=' + encodeURIComponent(id) + '&candidates=1')
    .then(function (r) { return r.json(); })
    .then(function (d) { render((d && d.candidates) || []); if (d && d.error) $('status').textContent = d.error; })
    .catch(function (e) { $('list').textContent = 'Search failed: ' + e.message; });
}
</script>
</body>
</html>
